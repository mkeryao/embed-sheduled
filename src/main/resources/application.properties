# H2 Database Configuration (for development/testing)
# In-memory database, useful for quick startup and testing.
# DB_CLOSE_DELAY=-1 keeps the database alive as long as the VM is alive.
# DB_CLOSE_ON_EXIT=FALSE prevents closing the DB when the last connection is closed (good for web apps).
#spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect # Though not using JPA directly, good to specify for Spring Boot auto-config

# MySQL Configuration (example, uncomment and configure as needed for production)
spring.datasource.url=jdbc:mysql://localhost:3306/job-flow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234567890ok
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Spring Boot Actuator (optional, for monitoring and management)
# Exposes all web endpoints (e.g., /actuator/health, /actuator/info). Use with caution in production.
management.endpoints.web.exposure.include=*
# Shows full details for health endpoint, including disk space, database status, etc.
management.endpoint.health.show-details=always


# Task Scheduling Configuration
# Size of the thread pool used by the TaskScheduler for running scheduled tasks.
spring.task.scheduling.pool.size=10

# Distributed Lock Retry Configuration
# Maximum number of attempts to acquire a distributed lock before giving up.
scheduler.lock.retry.maxAttempts=3
# Delay in milliseconds between attempts to acquire a distributed lock.
scheduler.lock.retry.delayMs=1000
scheduler.groups[0] =DEFAULT_GROUP
scheduler.groups[1] =MAIN_GROUP

# JWT (JSON Web Token) Configuration
# Secret key for signing JWTs. MUST be a strong, long, random string in production.
# Minimum length for HS256 algorithm is 32 bytes (256 bits).
# Example: Use a Base64 encoded string of at least 32 bytes.
jwt.secret=YourDefaultSecretKeyNeedsToBeLongAndStrongEnoughForHS256 # Replace with a strong key
# Token expiration time in milliseconds. Default is 1 hour (3600000 ms).
jwt.expirationMs=3600000

# Scheduler Instance ID (Optional)
# Unique ID for this scheduler instance. Useful in a clustered environment for identifying lock owners.
# If not provided, a random UUID will be generated on startup.
# scheduler.instance.id=my-scheduler-instance-01
