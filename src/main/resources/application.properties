# H2 Database Configuration (for development/testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL Configuration (example, uncomment and configure as needed)
# spring.datasource.url=jdbc:mysql://localhost:3306/task_scheduler_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=your_mysql_user
# spring.datasource.password=your_mysql_password
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Spring Boot Actuator (optional, for monitoring)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.taskscheduler=DEBUG

# Task Scheduling
# Configure thread pool size for task scheduler
spring.task.scheduling.pool.size=10

# Distributed Lock Retry Configuration
scheduler.lock.retry.maxAttempts=3
scheduler.lock.retry.delayMs=1000
