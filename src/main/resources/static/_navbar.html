<!-- i18n script needs to be loaded before main.js if main.js might use i18n, or before this navbar script if it uses i18n -->
<script src="js/i18n.js"></script>
<script>
$(document).ready(function() {
    // Set logged-in username
    const username = localStorage.getItem('username');
    if (username) {
        $('#loggedInUser').text(username);
    } else {
         $('#loggedInUser').text('N/A'); // Should not happen if auth check is working
    }

    // Highlight active nav link
    const path = window.location.pathname.split("/").pop() || "tasks.html"; // Default to tasks.html if path is empty
    $('#navbarNav .nav-link').each(function() {
        const href = $(this).attr('href');
        if (href === path) {
            $(this).addClass('active'); // Bootstrap 4 uses .active directly on .nav-link
            $(this).attr('aria-current', 'page');
        } else {
            $(this).removeClass('active');
            $(this).removeAttr('aria-current');
        }
    });

    // Language Switcher Logic
    if (typeof i18n !== 'undefined') {
        $('.lang-select-btn').on('click', function(e) {
            e.preventDefault();
            const selectedLang = $(this).data('lang');
            i18n.init(selectedLang).then(() => {
                // The i18n.applyTranslations() is called within i18n.init()
                // If specific components on the page need to re-render based on language,
                // they should listen to a custom event or be manually updated here.
                // For example, if table headers are dynamically generated:
                // if (typeof updateTableHeaders === 'function') { updateTableHeaders(); }
                console.log(`Language switched to ${selectedLang} via _navbar.html handler.`);
            }).catch(err => console.error("Error during language switch in navbar:", err));
        });
    } else {
        console.error("i18n object not found in _navbar.html. Language switcher will not work.");
    }
});
</script>
