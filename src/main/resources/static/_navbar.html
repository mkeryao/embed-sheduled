<!-- i18n script needs to be loaded before main.js if main.js might use i18n, or before this navbar script if it uses i18n -->
<script src="js/i18n.js"></script>
<script src="js/i18n-init.js"></script>
<script>
$(document).ready(function() {
    // Set logged-in username
    const username = localStorage.getItem('username');
    if (username) {
        $('#loggedInUser').text(username);
    } else {
         $('#loggedInUser').text('N/A'); // Should not happen if auth check is working
    }

    // Highlight active nav link
    const path = window.location.pathname.split("/").pop() || "tasks.html"; // Default to tasks.html if path is empty
    $('#navbarNav .nav-link').each(function() {
        const href = $(this).attr('href');
        if (href === path) {
            $(this).addClass('active'); // Bootstrap 4 uses .active directly on .nav-link
            $(this).attr('aria-current', 'page');
        } else {
            $(this).removeClass('active');
            $(this).removeAttr('aria-current');
        }
    });    // Language Switcher Logic
    // 我们使用i18n-init.js中的全局函数处理语言切换
    // DOM ContentLoaded事件中会自动绑定语言切换按钮
    // 这里不需要额外绑定事件，为了兼容性保留此代码块
});
</script>
