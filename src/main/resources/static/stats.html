<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>任务统计 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="my-3">
            <h2>任务统计</h2>
            <p class="text-muted">任务执行统计信息</p>
        </div>
        
        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">总任务数</div>
                    <div class="stat-value text-primary" id="total-tasks">0</div>
                    <div class="stat-footer">
                        <i class="fas fa-tasks mr-1"></i> 系统中定义的所有任务
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">今日执行次数</div>
                    <div class="stat-value text-success" id="today-executions">0</div>
                    <div class="stat-footer">
                        <i class="fas fa-calendar-check mr-1"></i> 今天执行的任务总次数
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">成功率</div>
                    <div class="stat-value text-info" id="success-rate">0%</div>
                    <div class="stat-footer">
                        <i class="fas fa-chart-line mr-1"></i> 最近30天成功率
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">故障任务数</div>
                    <div class="stat-value text-danger" id="failed-tasks">0</div>
                    <div class="stat-footer">
                        <i class="fas fa-exclamation-triangle mr-1"></i> 最近失败的任务数量
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 任务类型分布 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">任务类型分布</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="task-type-chart" style="height: 300px; width: 100%;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">执行状态分布</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="execution-status-chart" style="height: 300px; width: 100%;"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 最近执行的任务 -->
        <div class="card mb-4">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">最近执行的任务</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="thead-light">
                            <tr>
                                <th>ID</th>
                                <th>任务名称</th>
                                <th>开始时间</th>
                                <th>结束时间</th>
                                <th>状态</th>
                                <th>实例</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recent-executions-tbody">
                            <!-- 最近执行的任务会通过JavaScript动态添加 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <!-- 使用本地Chart.js库 -->
    <script src="libs/chartjs/chart.min.js"></script>
    </script>
    <script src="js/main.js"></script>
    <script>
        // 确保页面中有showFeedback函数，以防main.js中safeParseJSON使用它
        function showFeedback(message, isError = false) {
            // 在控制台中记录消息
            if (isError) {
                console.error(message);
            } else {
                console.log(message);
            }
            
            // 如果页面中有反馈提示元素，使用它
            const feedbackDiv = $('#feedback-message');
            if (feedbackDiv.length) {
                feedbackDiv.text(message)
                       .removeClass(isError ? 'alert-success' : 'alert-danger')
                       .addClass(isError ? 'alert-danger' : 'alert-success')
                       .show();
                setTimeout(() => feedbackDiv.hide(), 5000); // 5秒后隐藏
            } else {
                // 如果不存在反馈元素，创建一个临时的
                const tempFeedback = $('<div>')
                    .attr('id', 'temp-feedback')
                    .addClass('alert')
                    .addClass(isError ? 'alert-danger' : 'alert-success')
                    .css({
                        'position': 'fixed',
                        'top': '10px',
                        'right': '10px',
                        'z-index': '9999',
                        'padding': '10px 15px',
                        'border-radius': '4px',
                        'max-width': '80%'
                    })
                    .text(message);
                
                $('body').append(tempFeedback);
                setTimeout(() => tempFeedback.fadeOut(400, function() { $(this).remove(); }), 5000);
            }
        }
        
        // 将函数暴露到全局，以便main.js中可以使用
        window.showFeedback = showFeedback;
        
        $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                const currentUsername = localStorage.getItem('username');
                if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                }
                $('#logout-link').on('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            });
            
            // 加载统计数据
            loadStatistics();
            
            // 加载最近执行的任务
            loadRecentExecutions();
            
            function loadStatistics() {
                makeApiCall('GET', '/tasks/statistics', null,
                    function(data) {
                        try {
                            // 防御性编程，确保data是有效对象
                            if (!data) {
                                console.error('API返回的统计数据为空');
                                showFeedback('无法加载统计数据：服务器返回空数据', true);
                                return;
                            }
                            
                            // 更新统计卡片
                            $('#total-tasks').text(data.totalTasks || 0);
                            $('#today-executions').text(data.todayExecutions || 0);
                            $('#success-rate').text((data.successRate || 0) + '%');
                            $('#failed-tasks').text(data.recentFailedTasks || 0);
                            
                            // 渲染任务类型图表
                            if (data.taskTypeDistribution) {
                                // 确保taskTypeDistribution是有效对象
                                if (typeof data.taskTypeDistribution === 'object') {
                                    renderTaskTypeChart(data.taskTypeDistribution);
                                }
                            }
                            
                            // 渲染执行状态图表
                            if (data.executionStatusDistribution) {
                                // 确保executionStatusDistribution是有效对象
                                if (typeof data.executionStatusDistribution === 'object') {
                                    renderExecutionStatusChart(data.executionStatusDistribution);
                                }
                            }
                        } catch (err) {
                            console.error('处理统计数据时出错:', err);
                            showFeedback('处理统计数据时发生错误', true);
                        }
                    },
                    function(jqXHR, textStatus, errorThrown) {
                        console.error('加载统计数据出错:', textStatus, errorThrown);
                        let errorMsg = textStatus;
                        if (jqXHR.responseJSON && jqXHR.responseJSON.message) {
                            errorMsg = jqXHR.responseJSON.message;
                        } else if (errorThrown) {
                            errorMsg = errorThrown;
                        }
                        showFeedback('加载统计数据出错: ' + errorMsg, true);
                    }
                );
            }
            
            function loadRecentExecutions() {
                makeApiCall('GET', '/logs?page=0&size=10', null,
                    function(data) {
                        try {
                            const tbody = $('#recent-executions-tbody');
                            tbody.empty();
                            
                            // 确保data是有效的数组
                            if (!data) {
                                console.error('日志数据为空');
                                tbody.append('<tr><td colspan="7" class="text-center">无法加载执行记录</td></tr>');
                                return;
                            }
                            
                            // 如果返回的不是数组，尝试转换
                            let logsData = data;
                            if (!Array.isArray(logsData)) {
                                // 如果是对象且有content字段，可能是分页响应
                                if (logsData.content && Array.isArray(logsData.content)) {
                                    logsData = logsData.content;
                                } else {
                                    // 其他情况尝试转成数组处理
                                    console.warn('日志数据不是数组:', logsData);
                                    logsData = [].concat(logsData);
                                }
                            }
                            
                            if (logsData && logsData.length > 0) {
                                logsData.forEach(function(log) {
                                    let statusClass = '';
                                    switch(log.state) {
                                        case 'SUCCESS': 
                                            statusClass = 'badge-success';
                                            break;
                                        case 'FAILED':
                                            statusClass = 'badge-danger';
                                            break;
                                        case 'RUNNING':
                                            statusClass = 'badge-primary';
                                            break;
                                        case 'TIMED_OUT':
                                            statusClass = 'badge-warning';
                                            break;
                                        case 'SKIPPED':
                                            statusClass = 'badge-secondary';
                                            break;
                                        default:
                                            statusClass = 'badge-info';
                                    }
                                    
                                    const row = `<tr>
                                        <td>${log.logId || '-'}</td>
                                        <td>${log.taskName || 'Unknown'}</td>
                                        <td>${formatDateTime(log.startTime)}</td>
                                        <td>${formatDateTime(log.endTime) || '-'}</td>
                                        <td><span class="badge ${statusClass}">${log.state || 'Unknown'}</span></td>
                                        <td>${log.instanceId || '-'}</td>
                                        <td>
                                            <a href="logs.html?logId=${log.logId}" class="btn btn-sm btn-info">
                                                <i class="fas fa-eye"></i> 查看详情
                                            </a>
                                        </td>
                                    </tr>`;
                                    
                                    tbody.append(row);
                                });
                            } else {
                                tbody.append('<tr><td colspan="7" class="text-center">没有执行记录</td></tr>');
                            }
                        } catch (error) {
                            console.error('处理日志数据时出错:', error);
                            $('#recent-executions-tbody').html('<tr><td colspan="7" class="text-center text-danger">处理数据时出错</td></tr>');
                            showFeedback('处理日志数据时发生错误', true);
                        }
                    },
                    function(jqXHR, textStatus, errorThrown) {
                        console.error('加载日志数据出错:', textStatus, errorThrown);
                        let errorMsg = textStatus;
                        if (jqXHR.responseJSON && jqXHR.responseJSON.message) {
                            errorMsg = jqXHR.responseJSON.message;
                        } else if (errorThrown) {
                            errorMsg = errorThrown;
                        }
                        $('#recent-executions-tbody').html('<tr><td colspan="7" class="text-center text-danger">加载失败</td></tr>');
                        showFeedback('加载最近执行记录出错: ' + errorMsg, true);
                    }
                );
            }
            
            // 复用main.js中定义的日期时间格式化函数
            // 如果 formatDateTime 未定义，提供一个本地实现
            function formatDateTime(dateTimeStr) {
                if (window.formatDateTime) {
                    return window.formatDateTime(dateTimeStr);
                }
                
                if (!dateTimeStr) return '-';
                
                try {
                    const date = new Date(dateTimeStr);
                    if (isNaN(date.getTime())) return '-';
                    return date.toLocaleString();
                } catch (e) {
                    console.error('日期显示格式化错误:', e);
                    return '-';
                }
            }
            
            function renderTaskTypeChart(data) {
                try {
                    // 首先检查Chart.js是否可用
                    if (typeof Chart === 'undefined') {
                        console.error('Chart.js库未加载，使用备用表格显示');
                        renderTaskTypeAsTable(data);
                        return;
                    }
                    
                    const chartElement = document.getElementById('task-type-chart');
                    if (!chartElement) {
                        console.error('找不到任务类型图表容器元素');
                        return;
                    }
                    
                    // 确保是Canvas元素
                    let ctx;
                    try {
                        ctx = chartElement.getContext('2d');
                    } catch (e) {
                        console.error('无法获取Canvas上下文，可能不是Canvas元素:', e);
                        // 替换为Canvas元素
                        const parentElement = chartElement.parentElement;
                        const newCanvas = document.createElement('canvas');
                        newCanvas.id = 'task-type-chart';
                        newCanvas.style.height = '300px';
                        newCanvas.style.width = '100%';
                        if (parentElement) {
                            parentElement.replaceChild(newCanvas, chartElement);
                            try {
                                ctx = newCanvas.getContext('2d');
                            } catch (err) {
                                console.error('替换后仍无法获取Canvas上下文，切换到表格显示:', err);
                                renderTaskTypeAsTable(data);
                                return;
                            }
                        } else {
                            console.error('无法找到父元素来替换图表元素');
                            return;
                        }
                    }
                    
                    // 确保data是有效对象，如果是字符串尝试解析
                    let chartData = data;
                    if (typeof data === 'string') {
                        try {
                            chartData = JSON.parse(data);
                        } catch (e) {
                            console.error('无法解析任务类型分布数据:', e);
                            showErrorInChartContainer('task-type-chart', '数据解析失败');
                            return;
                        }
                    }
                    
                    // 如果是数组，尝试转换为对象格式
                    if (Array.isArray(chartData)) {
                        const objData = {};
                        chartData.forEach(item => {
                            if (item && item.key !== undefined && item.value !== undefined) {
                                objData[item.key] = item.value;
                            }
                        });
                        chartData = objData;
                    }
                    
                    // 确保我们有键值对可使用
                    if (!chartData || typeof chartData !== 'object') {
                        console.error('任务类型数据格式错误:', chartData);
                        showErrorInChartContainer('task-type-chart', '数据格式错误');
                        return;
                    }
                    
                    // 修复数字键不带引号的问题，将整数键转换为字符串
                    if (typeof chartData === 'object' && !Array.isArray(chartData)) {
                        const fixedData = {};
                        Object.keys(chartData).forEach(key => {
                            fixedData[String(key)] = chartData[key];
                        });
                        chartData = fixedData;
                    }
                    
                    const labels = Object.keys(chartData).map(type => {
                        switch(parseInt(type)) {
                            case 0: return 'Bean任务';
                            case 2: return 'HTTP任务';
                            case 4: return 'Shell脚本';
                            case 10: return '工作流';
                            default: return `类型 ${type}`;
                        }
                    });
                    
                    const values = Object.values(chartData);
                    
                    if (labels.length === 0 || values.length === 0) {
                        console.warn('任务类型数据为空');
                        showErrorInChartContainer('task-type-chart', '无可用数据');
                        return;
                    }
                    
                    // 检查是否已有图表实例，如有则销毁
                    if (window.taskTypeChart) {
                        window.taskTypeChart.destroy();
                    }
                    
                    // 创建新的图表实例
                    window.taskTypeChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: values,
                                backgroundColor: [
                                    '#28a745', // Bean - Green
                                    '#17a2b8', // HTTP - Cyan
                                    '#6610f2', // Shell - Purple
                                    '#fd7e14'  // Workflow - Orange
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                } catch (err) {
                    console.error('渲染任务类型图表时出错:', err);
                    showErrorInChartContainer('task-type-chart', '图表渲染失败');
                }
            }
            
            // 辅助函数：在图表容器中显示错误信息
            function showErrorInChartContainer(containerId, message) {
                const container = document.getElementById(containerId);
                if (!container) return;
                
                // 保存原始容器ID和样式
                const originalId = container.id;
                const originalStyle = container.getAttribute('style');
                
                // 创建一个div来替换canvas
                const errorDiv = document.createElement('div');
                errorDiv.id = originalId;
                if (originalStyle) {
                    errorDiv.setAttribute('style', originalStyle);
                }
                errorDiv.className = 'chart-error-container';
                errorDiv.innerHTML = `<div class="text-center text-danger">${message}</div>`;
                
                // 替换容器
                if (container.parentNode) {
                    container.parentNode.replaceChild(errorDiv, container);
                }
            }
            
            // 辅助函数：将任务类型数据渲染为HTML表格
            function renderTaskTypeAsTable(data) {
                try {
                    // 确保data是有效对象
                    let chartData = data;
                    if (typeof data === 'string') {
                        try {
                            chartData = JSON.parse(data);
                        } catch (e) {
                            console.error('渲染表格时无法解析任务类型分布数据:', e);
                            showErrorInChartContainer('task-type-chart', '数据解析失败');
                            return;
                        }
                    }
                    
                    // 如果是数组，尝试转换为对象格式
                    if (Array.isArray(chartData)) {
                        const objData = {};
                        chartData.forEach(item => {
                            if (item && item.key !== undefined && item.value !== undefined) {
                                objData[item.key] = item.value;
                            }
                        });
                        chartData = objData;
                    }
                    
                    // 确保我们有键值对可使用
                    if (!chartData || typeof chartData !== 'object') {
                        console.error('任务类型数据格式错误:', chartData);
                        showErrorInChartContainer('task-type-chart', '数据格式错误');
                        return;
                    }
                    
                    const chartElement = document.getElementById('task-type-chart');
                    const parent = chartElement.parentElement;
                    
                    // 创建表格
                    const table = document.createElement('table');
                    table.className = 'table table-bordered table-hover';
                    table.id = 'task-type-table';
                    table.innerHTML = `
                        <thead class="thead-light">
                            <tr>
                                <th>任务类型</th>
                                <th>数量</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    `;
                    
                    const tbody = table.querySelector('tbody');
                    
                    // 添加数据行
                    Object.keys(chartData).forEach(type => {
                        let typeName;
                        switch(parseInt(type)) {
                            case 0: typeName = 'Bean任务'; break;
                            case 2: typeName = 'HTTP任务'; break;
                            case 4: typeName = 'Shell脚本'; break;
                            case 10: typeName = '工作流'; break;
                            default: typeName = `类型 ${type}`; break;
                        }
                        
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${typeName}</td>
                            <td>${chartData[type]}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    
                    // 替换图表元素
                    if (parent) {
                        parent.replaceChild(table, chartElement);
                    }
                } catch (err) {
                    console.error('渲染任务类型表格时出错:', err);
                    showErrorInChartContainer('task-type-chart', '表格渲染失败');
                }
            }
            
            // 辅助函数：将执行状态数据渲染为HTML表格
            function renderExecutionStatusAsTable(data) {
                try {
                    // 确保data是有效对象
                    let chartData = data;
                    if (typeof data === 'string') {
                        try {
                            chartData = JSON.parse(data);
                        } catch (e) {
                            console.error('渲染表格时无法解析执行状态分布数据:', e);
                            showErrorInChartContainer('execution-status-chart', '数据解析失败');
                            return;
                        }
                    }
                    
                    // 如果是数组，尝试转换为对象格式
                    if (Array.isArray(chartData)) {
                        const objData = {};
                        chartData.forEach(item => {
                            if (item && item.key !== undefined && item.value !== undefined) {
                                objData[item.key] = item.value;
                            }
                        });
                        chartData = objData;
                    }
                    
                    // 确保我们有键值对可使用
                    if (!chartData || typeof chartData !== 'object') {
                        console.error('执行状态数据格式错误:', chartData);
                        showErrorInChartContainer('execution-status-chart', '数据格式错误');
                        return;
                    }
                    
                    const chartElement = document.getElementById('execution-status-chart');
                    const parent = chartElement.parentElement;
                    
                    // 创建表格
                    const table = document.createElement('table');
                    table.className = 'table table-bordered table-hover';
                    table.id = 'execution-status-table';
                    table.innerHTML = `
                        <thead class="thead-light">
                            <tr>
                                <th>执行状态</th>
                                <th>数量</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    `;
                    
                    const tbody = table.querySelector('tbody');
                    
                    // 添加数据行
                    Object.keys(chartData).forEach(status => {
                        const row = document.createElement('tr');
                        let statusClass;
                        
                        switch(status) {
                            case 'SUCCESS': statusClass = 'text-success'; break;
                            case 'FAILED': statusClass = 'text-danger'; break;
                            case 'RUNNING': statusClass = 'text-primary'; break;
                            case 'TIMED_OUT': statusClass = 'text-warning'; break;
                            case 'SKIPPED': statusClass = 'text-secondary'; break;
                            default: statusClass = 'text-info'; break;
                        }
                        
                        row.innerHTML = `
                            <td><span class="${statusClass}">${status}</span></td>
                            <td>${chartData[status]}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    
                    // 替换图表元素
                    if (parent) {
                        parent.replaceChild(table, chartElement);
                    }
                } catch (err) {
                    console.error('渲染执行状态表格时出错:', err);
                    showErrorInChartContainer('execution-status-chart', '表格渲染失败');
                }
            }
            
            function renderExecutionStatusChart(data) {
                try {
                    // 首先检查Chart.js是否可用
                    if (typeof Chart === 'undefined') {
                        console.error('Chart.js库未加载，使用备用表格显示');
                        renderExecutionStatusAsTable(data);
                        return;
                    }
                    
                    const chartElement = document.getElementById('execution-status-chart');
                    if (!chartElement) {
                        console.error('找不到执行状态图表容器元素');
                        return;
                    }
                    
                    // 确保是Canvas元素
                    let ctx;
                    try {
                        ctx = chartElement.getContext('2d');
                    } catch (e) {
                        console.error('无法获取Canvas上下文，可能不是Canvas元素:', e);
                        // 替换为Canvas元素
                        const parentElement = chartElement.parentElement;
                        const newCanvas = document.createElement('canvas');
                        newCanvas.id = 'execution-status-chart';
                        newCanvas.style.height = '300px';
                        newCanvas.style.width = '100%';
                        if (parentElement) {
                            parentElement.replaceChild(newCanvas, chartElement);
                            try {
                                ctx = newCanvas.getContext('2d');
                            } catch (err) {
                                console.error('替换后仍无法获取Canvas上下文，切换到表格显示:', err);
                                renderExecutionStatusAsTable(data);
                                return;
                            }
                        } else {
                            console.error('无法找到父元素来替换图表元素');
                            return;
                        }
                    }
                    
                    // 确保data是有效对象，如果是字符串尝试解析
                    let chartData = data;
                    if (typeof data === 'string') {
                        try {
                            chartData = JSON.parse(data);
                        } catch (e) {
                            console.error('无法解析执行状态分布数据:', e);
                            showErrorInChartContainer('execution-status-chart', '数据解析失败');
                            return;
                        }
                    }
                    
                    // 如果是数组，尝试转换为对象格式
                    if (Array.isArray(chartData)) {
                        const objData = {};
                        chartData.forEach(item => {
                            if (item && item.key !== undefined && item.value !== undefined) {
                                objData[item.key] = item.value;
                            }
                        });
                        chartData = objData;
                    }
                    
                    // 确保我们有键值对可使用
                    if (!chartData || typeof chartData !== 'object') {
                        console.error('执行状态数据格式错误:', chartData);
                        showErrorInChartContainer('execution-status-chart', '数据格式错误');
                        return;
                    }
                    
                    const labels = Object.keys(chartData);
                    const values = Object.values(chartData);
                    
                    if (labels.length === 0 || values.length === 0) {
                        console.warn('执行状态数据为空');
                        showErrorInChartContainer('execution-status-chart', '无可用数据');
                        return;
                    }
                    
                    const backgroundColors = labels.map(status => {
                        switch(status) {
                            case 'SUCCESS': return '#28a745';
                            case 'FAILED': return '#dc3545';
                            case 'RUNNING': return '#007bff';
                            case 'TIMED_OUT': return '#ffc107';
                            case 'SKIPPED': return '#6c757d';
                            default: return '#17a2b8';
                        }
                    });
                    
                    // 检查是否已有图表实例，如有则销毁
                    if (window.executionStatusChart) {
                        window.executionStatusChart.destroy();
                    }
                    
                    // 创建新的图表实例
                    window.executionStatusChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: values,
                                backgroundColor: backgroundColors,
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                } catch (err) {
                    console.error('渲染执行状态图表时出错:', err);
                    showErrorInChartContainer('execution-status-chart', '图表渲染失败');
                }
            }
        });
    </script>
</body>
</html>
