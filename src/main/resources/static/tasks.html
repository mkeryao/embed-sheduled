<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Management - Task Scheduler</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>Task Management</h2>
            <button class="btn btn-primary" data-toggle="modal" data-target="#taskFormModal" id="addTaskBtn">Add Task</button>
        </div>
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Group</th>
                    <th>Name</th>
                    <th>CRON</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Lock Name</th>
                    <th>Lock Seconds</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tasks-table-body">
                <!-- Task rows will be inserted here by jQuery -->
            </tbody>
        </table>
    </div>

    <!-- Task Form Modal -->
    <div class="modal fade" id="taskFormModal" tabindex="-1" role="dialog" aria-labelledby="taskFormModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskFormModalLabel">Add/Edit Task</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <input type="hidden" id="taskId">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="taskName">Task Name</label>
                                <input type="text" class="form-control" id="taskName" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="taskGroup">Task Group</label>
                                <input type="text" class="form-control" id="taskGroup" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="cronExpression">CRON Expression</label>
                            <input type="text" class="form-control" id="cronExpression" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea class="form-control" id="description" rows="2"></textarea>
                        </div>
                         <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="taskLockName">Task Lock Name (Optional)</label>
                                <input type="text" class="form-control" id="taskLockName">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="taskLockMostSeconds">Lock Max Seconds (Optional)</label>
                                <input type="number" class="form-control" id="taskLockMostSeconds" placeholder="e.g., 60">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="taskType">Task Type</label>
                            <select class="form-control" id="taskType">
                                <option value="0">Bean Task</option>
                                    <option value="3">Workflow Task</option>
                                <option value="1" disabled>HTTP Task (Not Implemented)</option>
                                <option value="2" disabled>Shell Script (Not Implemented)</option>
                            </select>
                        </div>
                        </div>

                        <!-- Type Specific Fields Container -->
                        <div id="typeSpecificFieldsContainer">
                            <!-- Bean Task Specific Fields -->
                            <div id="beanTaskFields" class="type-specific-fields" style="display:none;">
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="beanName">Bean Name</label>
                                    <input type="text" class="form-control" id="beanName">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="methodName">Method Name</label>
                                    <input type="text" class="form-control" id="methodName">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="beanParameters">Bean Parameters (JSON)</label>
                                <textarea class="form-control" id="beanParameters" rows="2" placeholder='{"key": "value"}'></textarea>
                            </div>
                        </div>
                        
                        <!-- HTTP Task Specific Fields -->
                        <div id="httpTaskFields" class="type-specific-fields" style="display:none;">
                            </div>

                        <!-- Shell Script Specific Fields -->
                        <div id="shellTaskFields" class="type-specific-fields" style="display:none;">
                            </div>

                        <!-- Workflow Task Specific Fields -->
                        <div id="workflowTaskFields" class="type-specific-fields" style="display:none;">
                            <div class="form-group">
                                <label for="globalParametersJson">Global Parameters (JSON, Optional)</label>
                                <textarea class="form-control" id="globalParametersJson" rows="3" placeholder='{"key": "globalValue", "api_url": "https://example.com"}'></textarea>
                            </div>
                            <div class="form-group">
                                <label for="workflowNodesJson">Workflow Nodes (JSON)</label>
                                <textarea class="form-control" id="workflowNodesJson" rows="5" placeholder='[{"nodeId":"node1", "taskConfigId":1, "parameters": {"input": "${global_api_key}"} }]'></textarea>
                                <small class="form-text text-muted">Define tasks (nodes). Parameters can use templating like `${nodeA_status}` or `${global_param}`.</small>
                            </div>
                             <div class="form-group">
                                <label for="workflowEdgesJson">Workflow Edges (JSON)</label>
                                <textarea class="form-control" id="workflowEdgesJson" rows="4" placeholder='[{"fromNodeId":"node1", "toNodeId":"node2", "expression": "${node1_status} == ''SUCCESS''"}]'></textarea>
                                <small class="form-text text-muted">Define transitions and conditions between nodes.</small>
                            </div>
                        </div>
                        </div> <!-- End of typeSpecificFieldsContainer -->

                        <hr>
                        <h5>Advanced Settings</h5>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="startDate">Start Date (Optional)</label>
                                <input type="date" class="form-control" id="startDate">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="endDate">End Date (Optional)</label>
                                <input type="date" class="form-control" id="endDate">
                            </div>
                        </div>
                        <div class="form-row">
                             <div class="form-group col-md-6">
                                <label for="taskCalendarGroup">Calendar Group for Exclusions (Optional)</label>
                                <input type="text" class="form-control" id="taskCalendarGroup" placeholder="e.g., NATIONAL_HOLIDAYS">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="taskExcludeTimes">Exclude Times (Optional)</label>
                                <input type="text" class="form-control" id="taskExcludeTimes" placeholder="e.g., 00:00-08:00,22:00-23:59">
                            </div>
                        </div>
                         <div class="form-group">
                            <label for="executeTimeoutSeconds">Execution Timeout (seconds, 0 for no timeout)</label>
                            <input type="number" class="form-control" id="executeTimeoutSeconds" value="0">
                        </div>

                        <hr>
                        <h5>Notification Settings</h5>
                         <div class="form-group">
                            <label for="notifySuccessUserIds">Notify Success - User IDs (comma-separated)</label>
                            <input type="text" class="form-control" id="notifySuccessUserIds" placeholder="e.g., 1,2,3">
                        </div>
                        <div class="form-group">
                            <label for="notifyFailedUserIds">Notify Failure/Timeout - User IDs (comma-separated)</label>
                            <input type="text" class="form-control" id="notifyFailedUserIds" placeholder="e.g., 1,4">
                        </div>

                        <div class="form-group form-check mt-3">
                            <input type="checkbox" class="form-check-input" id="isActive">
                            <label class="form-check-label" for="isActive">Active</label>
                        </div>
                        <button type="submit" class="btn btn-success">Save Task</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                // Ensure scripts in _navbar.html are also processed if any are there
                // For simple text setting like username, it should work fine.
                // Complex JS might need re-initialization.
                const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) { // Re-bind if not delegated
                    e.preventDefault();
                    logout();
                });
            });
            loadTasks();

            function getTaskTypeString(typeInt) {
                switch(typeInt) {
                    case 0: return "Bean";
                                // case 1: return "HTTP"; // Not yet enabled in UI dropdown fully
                                // case 2: return "Shell"; // Not yet enabled in UI dropdown fully
                                case 3: return "Workflow";
                                default: return `Unknown (${typeInt})`;
                }
            }

            function loadTasks() {
                makeApiCall('GET', '/tasks', null, 
                    function(tasks) {
                        const tableBody = $('#tasks-table-body');
                        tableBody.empty();
                        tasks.forEach(function(task) {
                            const status = task.isActive ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-secondary">Inactive</span>';
                            const row = `<tr>
                                <td>${task.taskId}</td>
                                <td>${task.taskGroup || ''}</td>
                                <td>${task.taskName || ''}</td>
                                <td>${task.cronExpression || ''}</td>
                                <td>${getTaskTypeString(task.taskType)}</td>
                                <td>${status}</td>
                                <td>${task.taskLockName || '-'}</td>
                                <td>${task.taskLockMostSeconds != null ? task.taskLockMostSeconds : '-'}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-sm btn-info edit-btn" data-id="${task.taskId}">Edit</button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${task.taskId}">Delete</button>
                                    <button class="btn btn-sm btn-secondary trigger-btn" data-id="${task.taskId}">Trigger</button>
                                    ${task.isActive 
                                        ? `<button class="btn btn-sm btn-warning disable-btn" data-id="${task.taskId}">Disable</button>`
                                        : `<button class="btn btn-sm btn-success enable-btn" data-id="${task.taskId}">Enable</button>`
                                    }
                                </td>
                            </tr>`;
                            tableBody.append(row);
                        });
                    }, 
                    function(jqXHR) {
                        showFeedback('Error loading tasks: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            // Show/hide type-specific fields based on selection
            $('#taskType').change(function() {
                const type = $(this).val();
                        $('.type-specific-fields').hide(); // Hide all type-specific sections
                        if (type === '0') { // Bean Task
                            $('#beanTaskFields').show();
                        } else if (type === '3') { // Workflow Task
                            $('#workflowTaskFields').show();
                            // For workflow, typically beanName, methodName etc. are not directly set on the parent workflow task.
                            // They are defined within the workflowNodes.
                            // You might want to disable/hide beanName, methodName for workflow parent task config.
                            $('#beanName, #methodName, #beanParameters').closest('.form-group').hide(); 
                        } else {
                            // For other types like HTTP/Shell if they were enabled and had specific fields
                            // $('#httpTaskFields').show(); or $('#shellTaskFields').show();
                             $('#beanName, #methodName, #beanParameters').closest('.form-group').show(); // Show for non-workflow bean tasks
                        }
                    }).trigger('change');

            $('#addTaskBtn').click(function() {
                $('#taskFormModalLabel').text('Add Task');
                $('#task-form')[0].reset();
                $('#taskId').val('');
                $('#executeTimeoutSeconds').val(0); // Default timeout
                $('#isActive').prop('checked', true); // Default to active
                $('#taskType').trigger('change');
            });

            $('#task-form').submit(function(event) {
                event.preventDefault();
                const taskId = $('#taskId').val();
                const taskData = {
                    taskName: $('#taskName').val(),
                    taskGroup: $('#taskGroup').val(),
                    cronExpression: $('#cronExpression').val(),
                    description: $('#description').val(),
                    taskLockName: $('#taskLockName').val() || null,
                    taskLockMostSeconds: $('#taskLockMostSeconds').val() ? parseInt($('#taskLockMostSeconds').val()) : null,
                    taskType: parseInt($('#taskType').val()),
                    isActive: $('#isActive').is(':checked'),
                    
                    // Type-specific fields
                    beanName: $('#beanName').val(),
                    methodName: $('#methodName').val(),
                    beanParameters: $('#beanParameters').val(),
                    httpUrl: $('#httpUrl').val(), // Will be null if not HTTP task
                    httpMethod: $('#httpMethod').val(),
                    httpHeaders: $('#httpHeaders').val(),
                    httpBody: $('#httpBody').val(),
                    scriptPath: $('#scriptPath').val(), // Will be null if not Shell task
                    scriptParameters: $('#scriptParameters').val(),

                    // Advanced settings
                    startDate: $('#startDate').val() || null,
                    endDate: $('#endDate').val() || null,
                    taskCalendarGroup: $('#taskCalendarGroup').val() || null,
                    taskExcludeTimes: $('#taskExcludeTimes').val() || null,
                    executeTimeoutSeconds: parseInt($('#executeTimeoutSeconds').val()) || 0,
                    notifySuccessUserIds: $('#notifySuccessUserIds').val() || null,
                    notifyFailedUserIds: $('#notifyFailedUserIds').val() || null,

                    // Workflow specific fields (as List<WorkflowNode>, List<WorkflowEdge> in DTO)
                    // The controller will convert these from JSON strings if they are sent as such.
                    // Or, if the DTO expects lists, parse them here.
                    // For now, assume the controller handles TaskConfigDto which has List<...>
                    workflowNodes: parseJsonOrNull($('#workflowNodesJson').val()),
                    workflowEdges: parseJsonOrNull($('#workflowEdgesJson').val()),
                    globalParameters: parseJsonOrNull($('#globalParametersJson').val())
                };

                // Clear empty fields for type-specific data that isn't relevant
                if (taskData.taskType !== 0) {
                    taskData.beanName = null; taskData.methodName = null; taskData.beanParameters = null;
                    // taskData.httpUrl = null; etc. for other types
                    taskData.workflowNodes = null; taskData.workflowEdges = null;
                }
                // Similar logic for other types if they were mutually exclusive for these fields
                if (taskData.taskType !== 3) { // Not a workflow task
                    taskData.workflowNodes = null; taskData.workflowEdges = null;
                } else { // Is a workflow task, clear bean/http/shell specific fields
                    taskData.beanName = null; taskData.methodName = null; taskData.beanParameters = null;
                    // taskData.httpUrl = null; etc.
                }

                // ... (rest of the method)


                const method = taskId ? 'PUT' : 'POST';
                const endpoint = taskId ? `/tasks/${taskId}` : '/tasks';

                makeApiCall(method, endpoint, taskData, 
                    function(response) {
                        $('#taskFormModal').modal('hide');
                        showFeedback('Task saved successfully!', false);
                        loadTasks();
                    }, 
                    function(jqXHR) {
                        showFeedback('Error saving task: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Edit button
            $('#tasks-table-body').on('click', '.edit-btn', function() {
                const taskId = $(this).data('id');
                makeApiCall('GET', `/tasks/${taskId}`, null, 
                    function(task) {
                        $('#taskFormModalLabel').text('Edit Task');
                        $('#taskId').val(task.taskId);
                        $('#taskName').val(task.taskName);
                        $('#taskGroup').val(task.taskGroup);
                        $('#cronExpression').val(task.cronExpression);
                        $('#description').val(task.description);
                        $('#taskLockName').val(task.taskLockName);
                        $('#taskLockMostSeconds').val(task.taskLockMostSeconds);
                        $('#taskType').val(task.taskType.toString()).trigger('change');
                        $('#isActive').prop('checked', task.isActive);

                        // Populate type-specific fields
                        $('#beanName').val(task.beanName);
                        $('#methodName').val(task.methodName);
                        $('#beanParameters').val(task.beanParameters);
                        
                        // Populate workflow fields
                        $('#workflowNodesJson').val(task.workflowNodes ? JSON.stringify(task.workflowNodes, null, 2) : '');
                        $('#workflowEdgesJson').val(task.workflowEdges ? JSON.stringify(task.workflowEdges, null, 2) : '');
                        $('#globalParametersJson').val(task.globalParameters ? JSON.stringify(task.globalParameters, null, 2) : '');

                        // Populate advanced settings
                        $('#startDate').val(task.startDate);
                        $('#endDate').val(task.endDate);
                        $('#taskCalendarGroup').val(task.taskCalendarGroup);
                        $('#taskExcludeTimes').val(task.taskExcludeTimes);
                        $('#executeTimeoutSeconds').val(task.executeTimeoutSeconds != null ? task.executeTimeoutSeconds : 0);
                        $('#notifySuccessUserIds').val(task.notifySuccessUserIds);
                        $('#notifyFailedUserIds').val(task.notifyFailedUserIds);
                        
                        $('#taskFormModal').modal('show');
                    },
                    function(jqXHR) {
                         showFeedback('Error fetching task details: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Delete button
            $('#tasks-table-body').on('click', '.delete-btn', function() {
                const taskId = $(this).data('id');
                if (confirm('Are you sure you want to delete task ' + taskId + '?')) {
                    makeApiCall('DELETE', `/tasks/${taskId}`, null, 
                        function() {
                            showFeedback('Task deleted successfully!', false);
                            loadTasks();
                        },
                        function(jqXHR) {
                            showFeedback('Error deleting task: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });

            // Trigger button
            $('#tasks-table-body').on('click', '.trigger-btn', function() {
                const taskId = $(this).data('id');
                makeApiCall('POST', `/tasks/${taskId}/trigger`, null, 
                    function() {
                        showFeedback('Task ' + taskId + ' triggered successfully!', false);
                    },
                    function(jqXHR) {
                        showFeedback('Error triggering task: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Enable/Disable buttons
            $('#tasks-table-body').on('click', '.enable-btn, .disable-btn', function() {
                const taskId = $(this).data('id');
                const isEnable = $(this).hasClass('enable-btn');
                const endpoint = `/tasks/${taskId}/${isEnable ? 'enable' : 'disable'}`;
                makeApiCall('POST', endpoint, null, 
                    function() {
                        showFeedback(`Task ${taskId} ${isEnable ? 'enabled' : 'disabled'} successfully!`, false);
                        loadTasks(); // Refresh table to show new status
                    },
                    function(jqXHR) {
                        showFeedback(`Error ${isEnable ? 'enabling' : 'disabling'} task: ` + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            function parseJsonOrNull(jsonString) {
                if (!jsonString || jsonString.trim() === '') {
                    return null;
                }
                try {
                    return JSON.parse(jsonString);
                } catch (e) {
                    showFeedback('Invalid JSON: ' + e.message, true);
                    throw e; // Stop submission
                }
            }
        });
    </script>
</body>
</html>
