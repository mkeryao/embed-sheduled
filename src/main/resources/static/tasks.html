<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">
    <title>任务管理 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <!-- 使用本地Font Awesome图标库 -->
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>任务管理</h2>
            <button class="btn btn-primary" data-toggle="modal" data-target="#taskFormModal" id="addTaskBtn">添加任务</button>
        </div>        <table class="table table-striped table-hover tasks-table">            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>任务组</th>
                    <th>任务名称</th>
                    <th>CRON表达式</th>
                    <th>任务类型</th>
                    <th>有效时间</th>
                    <th>状态</th>
                    <th>执行模式</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tasks-table-body">
                <!-- 任务行将通过jQuery在这里插入 -->
            </tbody>
        </table>
    </div>

    <!-- Task Form Modal -->    <div class="modal fade" id="taskFormModal" tabindex="-1" role="dialog" aria-labelledby="taskFormModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskFormModalLabel">添加/编辑任务</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <input type="hidden" id="taskId">
                        <div class="form-row">                            <div class="form-group col-md-6">
                                <label for="taskName">任务名称</label>
                                <input type="text" class="form-control" id="taskName" name="taskName" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="taskGroup">任务组</label>
                                <input type="text" class="form-control" id="taskGroup" name="taskGroup" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="cronExpression">CRON表达式</label>
                            <input type="text" class="form-control" id="cronExpression" name="cronExpression" required>
                        </div>                        <div class="form-group">
                            <label for="description">描述</label>
                            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="executionMode">执行模式</label>
                            <select class="form-control" id="executionMode" name="executionMode">
                                <option value="BROADCAST">广播模式 (所有实例)</option>
                                <option value="CLUSTER">集群模式 (单实例通过锁)</option>
                            </select>
                        </div><div class="form-group">
                            <label for="taskType">任务类型</label>
                            <select class="form-control" id="taskType" name="taskType">
                                <option value="0">Bean任务</option>
                                <option value="2">HTTP任务</option>
                                <option value="4">Shell脚本任务</option>
                                <option value="10">工作流任务</option>
                            </select>
                        </div>                        <!-- 任务特定字段容器 -->
                        <div id="typeSpecificFieldsContainer">                            <!-- Bean任务特定字段 (类型 0) -->
                            <div id="beanTaskFields" class="type-specific-fields" style="display:none;">
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="beanName">Bean名称</label>
                                        <input type="text" class="form-control" id="beanName" name="beanName" placeholder="例如: mySampleTask">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="methodName">方法名称</label>
                                        <input type="text" class="form-control" id="methodName" name="methodName" placeholder="例如: executeSuccess">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="beanParameters">Bean参数 (JSON)</label>
                                    <textarea class="form-control" id="beanParameters" name="beanParameters" rows="2" placeholder='{"key": "value"}'></textarea>
                                </div>
                            </div>                            <!-- Shell脚本任务特定字段 (类型 1) -->                            <div id="shellTaskFields" class="type-specific-fields" style="display:none;">
                                <div class="form-group">
                                    <label for="shellScriptContent">脚本内容或路径</label>
                                    <textarea class="form-control" id="shellScriptContent" name="shellScriptContent" rows="3" placeholder="例如: echo 'Hello' 或 /path/to/script.sh"></textarea>
                                </div>
                                <div class="form-group form-check">
                                    <input type="checkbox" class="form-check-input" id="shellIsInlineScript" name="shellIsInlineScript">
                                    <label class="form-check-label" for="shellIsInlineScript">内联脚本 (而非路径)</label>
                                </div>
                                <div class="form-group">
                                    <label for="shellArguments">参数 (每行一个)</label>
                                    <textarea class="form-control" id="shellArguments" name="shellArguments" rows="2" placeholder="参数1&#10;带空格的参数2"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="shellWorkingDirectory">工作目录 (可选)</label>
                                    <input type="text" class="form-control" id="shellWorkingDirectory" name="shellWorkingDirectory" placeholder="例如: /tmp">
                                </div>
                                <small class="form-text text-muted">
                                    注意: Shell脚本参数 (脚本、参数、工作目录、是否内联) 将作为JSON对象存储在数据库的"Bean参数"字段中。
                                    Shell任务不使用以下字段 (Bean名称、方法名称)。
                                </small>
                            </div>                            <!-- HTTP任务特定字段 (类型 2) -->
                            <div id="httpTaskFields" class="type-specific-fields" style="display:none;">
                                <div class="form-group">
                                    <label for="httpUrl">HTTP网址</label>
                                    <input type="url" class="form-control" id="httpUrl" name="httpUrl" placeholder="https://example.com/api/data" >
                                </div>
                                <div class="form-group">
                                    <label for="httpMethod">请求方法</label>
                                    <select class="form-control" id="httpMethod" name="httpMethod">
                                        <option value="GET">GET</option>
                                        <option value="POST">POST</option>
                                        <option value="PUT">PUT</option>
                                        <option value="DELETE">DELETE</option>
                                    </select>
                                </div>                                <div class="form-group">
                                    <label for="httpHeaders">HTTP请求头 (JSON)</label>
                                    <textarea class="form-control" id="httpHeaders" name="httpHeaders" rows="2" placeholder='{"Content-Type": "application/json", "X-API-KEY":"secret"}'></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="httpBody">请求体 (例如，POST/PUT的JSON)</label>
                                    <textarea class="form-control" id="httpBody" name="httpBody" rows="3" placeholder='{"key": "value"}'></textarea>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="httpConnectTimeout">连接超时 (毫秒, 可选)</label>
                                        <input type="number" class="form-control" id="httpConnectTimeout" name="httpConnectTimeout" placeholder="例如: 5000">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="httpReadTimeout">读取超时 (毫秒, 可选)</label>
                                        <input type="number" class="form-control" id="httpReadTimeout" name="httpReadTimeout" placeholder="例如: 10000">
                                    </div>
                                </div>
                                 <small class="form-text text-muted">
                                    注意: HTTP任务参数将作为JSON对象存储在数据库的"Bean参数"字段中。
                                    HTTP任务不使用以下字段 (Bean名称、方法名称)。
                                </small>
                            </div>                            <!-- 工作流任务特定字段 (类型 3) -->
                            <div id="workflowTaskFields" class="type-specific-fields" style="display:none;">                                <div class="form-group">
                                    <label for="globalParametersJson">全局参数 (JSON, 可选)</label>
                                <textarea class="form-control" id="globalParametersJson" name="globalParametersJson" rows="3" placeholder='{"key": "globalValue", "api_url": "https://example.com"}'></textarea>
                                </div>
                                
                                <!-- 工作流节点可视化编辑器 -->
                                <div class="form-group">
                                    <label>工作流节点</label>
                                    <div class="workflow-editor" id="workflow-nodes-editor">
                                        <div class="workflow-nodes-container">
                                            <!-- 节点会在这里动态添加 -->
                                        </div>
                                        <button type="button" class="btn btn-sm btn-primary mt-2" id="add-workflow-node-btn">
                                            <i class="fas fa-plus"></i> 添加节点
                                        </button>
                                    </div>
                                    <!-- 保留原始JSON输入用于调试和高级编辑 -->
                                    <textarea class="form-control d-none" id="workflowNodesJson" name="workflowNodesJson" rows="5" placeholder='[{"nodeId":"node1", "taskConfigId":1, "parameters": {"input": "${global_api_key}"} }]'></textarea>
                                </div>
                                
                                <!-- 工作流边可视化编辑器 -->
                                <div class="form-group">
                                    <label>工作流转换</label>
                                    <div class="workflow-editor" id="workflow-edges-editor">
                                        <div class="workflow-edges-container">
                                            <!-- 边会在这里动态添加 -->
                                        </div>
                                        <button type="button" class="btn btn-sm btn-primary mt-2" id="add-workflow-edge-btn">
                                            <i class="fas fa-plus"></i> 添加转换
                                        </button>
                                    </div>
                                    <!-- 保留原始JSON输入用于调试和高级编辑 -->
                                    <textarea class="form-control d-none" id="workflowEdgesJson" name="workflowEdgesJson" rows="4" placeholder='[{"fromNodeId":"node1", "toNodeId":"node2", "expression": "${node1_status} == ''SUCCESS''"}]'></textarea>
                                </div>
                            </div>                        </div> <!-- End of typeSpecificFieldsContainer -->

                        <hr>
                        <h5>高级设置</h5>                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="startDate">开始日期时间 (可选)</label>
                                <div class="datetime-control-group">
                                    <input type="datetime-local" class="form-control" id="startDate" name="startDate">
                                </div>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="endDate">结束日期时间 (可选)</label>
                                <div class="datetime-control-group">
                                    <input type="datetime-local" class="form-control" id="endDate" name="endDate">
                                </div>
                            </div>
                        </div>
                        <!-- 日期时间验证消息容器 -->
                        <div id="dateRangeValidation" class="datetime-validation"></div><div class="form-row">
                             <div class="form-group col-md-6">
                                <label for="taskCalendarGroup">排除时间日历组 (可选)</label>
                                <select class="form-control" id="taskCalendarGroup" name="taskCalendarGroup">
                                    <option value="">-- 选择日历 --</option>
                                    <!-- 日历选项会通过JS动态加载 -->
                                </select>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="taskExcludeTimes">排除时间段 (可选)</label>
                                <input type="text" class="form-control" id="taskExcludeTimes" name="taskExcludeTimes" placeholder="例如: 00:00-08:00,22:00-23:59">
                            </div>
                        </div>
                         <div class="form-group">
                            <label for="executeTimeoutSeconds">执行超时 (秒, 0表示无超时)</label>
                            <input type="number" class="form-control" id="executeTimeoutSeconds" name="executeTimeoutSeconds" value="0">
                        </div>                        <hr>
                        <h5>通知设置</h5>                         <div class="form-group">
                            <label for="notifySuccessUserIds">成功时通知用户</label>
                            <select class="form-control" id="notifySuccessUserIds" name="notifySuccessUserIds" multiple>
                                <!-- 用户选项会通过JS动态加载 -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notifyFailedUserIds">失败/超时时通知用户</label>
                            <select class="form-control" id="notifyFailedUserIds" name="notifyFailedUserIds" multiple>
                                <!-- 用户选项会通过JS动态加载 -->
                            </select>
                        </div>

                        <div class="form-group form-check mt-3">
                            <input type="checkbox" class="form-check-input" id="isActive" name="isActive">
                            <label class="form-check-label" for="isActive">激活</label>
                        </div>
                        <button type="submit" class="btn btn-success">保存任务</button>
                    </form>
                </div>
            </div>
        </div>
    </div>    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // 全局变量用于存储表单数据
        let formData = {
            users: [],
            calendars: [],
            beanTasks: []
        };
        
        $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                // Ensure scripts in _navbar.html are also processed if any are there
                // For simple text setting like username, it should work fine.
                // Complex JS might need re-initialization.
                const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) { // Re-bind if not delegated
                    e.preventDefault();
                    logout();
                });
            });            loadTasks();
            loadFormData(); // 新增：加载表单数据
            
            function getTaskTypeString(typeInt) {
                switch(typeInt) {
                    case 0: return "Bean任务";
                    case 2: return "HTTP任务";
                    case 4: return "Shell脚本";
                    case 10: return "工作流";
                    default: return `未知 (${typeInt})`;
                }
            }            function loadTasks() {
                makeApiCall('GET', '/tasks', null,
                    function(tasks) {
                        const tableBody = $('#tasks-table-body');
                        tableBody.empty();
                        tasks.forEach(function(task) {
                            // 兼容处理isActive字段，支持task.isActive和task.active两种情况
                            const isActive = (task.isActive !== undefined) ? task.isActive : task.active;
                            const status = isActive ? '<span class="badge badge-success"><i class="fas fa-check-circle"></i> 激活</span>' : '<span class="badge badge-secondary"><i class="fas fa-times-circle"></i> 未激活</span>';
                            // 使用新的格式化函数构建有效时间范围显示
                            let validTimeRange = formatDateTimeRange(task.startDate, task.endDate);
                            // 为有开始和结束日期的任务添加更明显的样式
                            if (task.startDate && task.endDate) {
                                validTimeRange = `<span class="start-date">从: ${formatDateTime(task.startDate, false)}</span>` +
                                                `<span class="end-date">至: ${formatDateTime(task.endDate, false)}</span>`;
                            } else if (task.startDate) {
                                validTimeRange = `<span class="start-date">从: ${formatDateTime(task.startDate, false)}</span>`;
                            } else if (task.endDate) {
                                validTimeRange = `<span class="end-date">至: ${formatDateTime(task.endDate, false)}</span>`;
                            }
                            
                            const row = `<tr>
                                <td>${task.taskId}</td>
                                <td>${task.taskGroup || ''}</td>
                                <td>${task.taskName || ''}</td>
                                <td>${task.cronExpression || ''}</td>
                                <td>${getTaskTypeString(task.taskType)}</td>
                                <td><small class="valid-time-range">${validTimeRange}</small></td>
                                <td>${status}</td>
                                <td>${task.executionMode || 'BROADCAST'}</td>                                <td class="action-buttons">
                                    <button class="btn btn-sm btn-info edit-btn" data-id="${task.taskId}"><i class="fas fa-edit"></i> 编辑</button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${task.taskId}"><i class="fas fa-trash"></i> 删除</button>
                                    <button class="btn btn-sm btn-secondary trigger-btn" data-id="${task.taskId}"><i class="fas fa-play"></i> 触发</button>
                                    <button class="btn btn-sm btn-info view-logs-btn" data-id="${task.taskId}" data-task-name="${task.taskName}"><i class="fas fa-clipboard-list"></i> 查看日志</button>                                    ${isActive
                                        ? `<button class="btn btn-sm btn-warning disable-btn" data-id="${task.taskId}"><i class="fas fa-ban"></i> 禁用</button>`
                                        : `<button class="btn btn-sm btn-success enable-btn" data-id="${task.taskId}"><i class="fas fa-check"></i> 启用</button>`
                                    }
                                </td>
                            </tr>`;
                            tableBody.append(row);
                        });
                    },
                    function(jqXHR) {
                        showFeedback('加载任务出错: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }            // 加载表单数据（用户、日历等）     
            function loadFormData() {
                makeApiCall('GET', '/api/tasks/form-data', null,
                    function(data) {
                        formData = data;
                        console.log("表单数据加载成功:", data);
                        
                        // 填充用户下拉框
                        const successUserSelect = $('#notifySuccessUserIds');
                        const failedUserSelect = $('#notifyFailedUserIds');
                        successUserSelect.empty();
                        failedUserSelect.empty();
                        
                        if (formData.users && formData.users.length) {
                            formData.users.forEach(user => {
                                successUserSelect.append(`<option value="${user.user_id}">${user.username}</option>`);
                                failedUserSelect.append(`<option value="${user.user_id}">${user.username}</option>`);
                            });
                        }
                        
                        // 填充日历下拉框
                        const calendarSelect = $('#taskCalendarGroup');
                        calendarSelect.empty();
                        calendarSelect.append('<option value="">-- 选择日历 --</option>');
                        
                        if (formData.calendars && formData.calendars.length) {
                            formData.calendars.forEach(calendar => {
                                calendarSelect.append(`<option value="${calendar.calendar_name}">${calendar.calendar_name}</option>`);
                            });
                        }
                        
                        // 填充工作流节点的任务选择器
                        if (formData.beanTasks && formData.beanTasks.length) {
                            console.log("成功加载Bean任务数据，可用于工作流节点");
                        }
                    },
                    function(jqXHR) {
                        console.error('加载表单数据出错:', jqXHR);
                        showFeedback('加载表单数据失败，请检查网络连接或刷新页面', true);
                    }
                );
            }
            
            // 添加Cron表达式验证函数
            function validateCronExpression() {
                const cronValue = $('#cronExpression').val();
                if (!cronValue) return;
                
                makeApiCall('GET', `/tasks/validate-cron?cronExpression=${encodeURIComponent(cronValue)}`, null,
                    function(data) {
                        const validationDiv = $('#cronValidation');
                        if (!validationDiv.length) {
                            $('#cronExpression').after('<div id="cronValidation" class="cron-validation"></div>');
                        }
                        
                        if (data.valid) {
                            $('#cronValidation').html('<i class="fas fa-check-circle"></i> 表达式有效').removeClass('invalid').addClass('valid');
                            
                            // 获取未来执行时间
                            makeApiCall('GET', `/tasks/next-execution-times?cronExpression=${encodeURIComponent(cronValue)}`, null,
                                function(times) {
                                    if (times && times.length) {
                                        let timeHtml = '<div class="mt-2"><strong>未来执行时间:</strong><ul class="small">';
                                        times.forEach(time => {
                                            timeHtml += `<li>${time}</li>`;
                                        });
                                        timeHtml += '</ul></div>';
                                        $('#cronValidation').append(timeHtml);
                                    }
                                }
                            );
                        } else {
                            $('#cronValidation').html('<i class="fas fa-exclamation-circle"></i> 表达式无效').removeClass('valid').addClass('invalid');
                        }
                    }
                );
            }
              // 更新JSON数据
            function updateNodesJson() {
                const nodes = [];
                $('.workflow-node-item').each(function() {
                    const nodeId = $(this).data('node-id');
                    const taskConfigId = $(this).find('.node-task-select').val();
                    const nodeName = $(this).find('.node-name-input').val();
                    const params = $(this).find('.node-params-input').val();
                    
                    let parameters = {};
                    try {
                        if (params) {
                            parameters = JSON.parse(params);
                        }
                    } catch (e) {
                        console.error('Error parsing node parameters:', e);
                    }
                    
                    nodes.push({
                        nodeId: nodeId,
                        taskConfigId: parseInt(taskConfigId),
                        nodeName: nodeName,
                        parameters: parameters
                    });
                });
                
                $('#workflowNodesJson').val(JSON.stringify(nodes, null, 2));
            }
            
            // 更新边JSON数据
            function updateEdgesJson() {
                const edges = [];
                $('.workflow-edge-item').each(function() {
                    const fromNodeId = $(this).find('.edge-from-select').val();
                    const toNodeId = $(this).find('.edge-to-select').val();
                    const priority = $(this).find('.edge-priority-input').val();
                    const expression = $(this).find('.edge-expression-input').val();
                    
                    edges.push({
                        fromNodeId: fromNodeId,
                        toNodeId: toNodeId,
                        priority: parseInt(priority),
                        expression: expression
                    });
                });
                
                $('#workflowEdgesJson').val(JSON.stringify(edges, null, 2));
            }
            
            // 更新所有边的节点选择器
            function updateNodeSelectors() {
                $('.workflow-edge-item').each(function() {
                    const fromVal = $(this).find('.edge-from-select').val();
                    const toVal = $(this).find('.edge-to-select').val();
                    updateEdgeNodeSelectors($(this), fromVal, toVal);
                });
            }
            
            // 更新特定边的节点选择器
            function updateEdgeNodeSelectors(edgeItem, fromNodeId, toNodeId) {
                const fromSelect = edgeItem.find('.edge-from-select');
                const toSelect = edgeItem.find('.edge-to-select');
                
                fromSelect.empty();
                toSelect.empty();
                
                fromSelect.append('<option value="">-- 选择节点 --</option>');
                toSelect.append('<option value="">-- 选择节点 --</option>');
                
                // 从已有节点项获取节点ID
                $('.workflow-node-item').each(function() {
                    const nodeId = $(this).data('node-id');
                    const nodeName = $(this).find('.node-name-input').val() || nodeId;
                    
                    fromSelect.append(`<option value="${nodeId}" ${nodeId === fromNodeId ? 'selected' : ''}>${nodeName}</option>`);
                    toSelect.append(`<option value="${nodeId}" ${nodeId === toNodeId ? 'selected' : ''}>${nodeName}</option>`);
                });
            }
            
            // 添加工作流节点项
            function addWorkflowNodeItem(node) {
                const container = $('.workflow-nodes-container');
                const nodeItem = $(`<div class="workflow-node-item" data-node-id="${node.nodeId}">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>节点ID</label>
                            <input type="text" class="form-control form-control-sm node-id-input" value="${node.nodeId}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label>任务</label>
                            <select class="form-control form-control-sm node-task-select">
                                <option value="">-- 选择任务 --</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>节点名称</label>
                            <input type="text" class="form-control form-control-sm node-name-input" value="${node.nodeName || ''}">
                        </div>
                        <div class="form-group col-md-6">
                            <label>参数 (JSON)</label>
                            <input type="text" class="form-control form-control-sm node-params-input" 
                                   value="${JSON.stringify(node.parameters || {})}">
                        </div>
                    </div>
                    <i class="fas fa-times delete-btn node-delete-btn"></i>
                </div>`);
                
                // 填充任务下拉框
                const taskSelect = nodeItem.find('.node-task-select');
                if (formData.beanTasks && formData.beanTasks.length) {
                    formData.beanTasks.forEach(task => {
                        const selected = task.task_id == node.taskConfigId ? 'selected' : '';
                        taskSelect.append(`<option value="${task.task_id}" ${selected}>${task.task_name} (${task.bean_name})</option>`);
                    });
                }
                
                // 删除按钮事件
                nodeItem.find('.node-delete-btn').click(function() {
                    nodeItem.remove();
                    updateNodesJson();
                    updateNodeSelectors();
                });
                
                // 输入框变化事件
                nodeItem.find('input, select').change(function() {
                    updateNodesJson();
                    updateNodeSelectors();
                });
                
                container.append(nodeItem);
                updateNodesJson();
                updateNodeSelectors();
            }
            
            // 添加工作流边项
            function addWorkflowEdgeItem(edge) {
                const container = $('.workflow-edges-container');
                const edgeItem = $(`<div class="workflow-edge-item">
                    <div class="form-row">
                        <div class="form-group col-md-5">
                            <label>从节点</label>
                            <select class="form-control form-control-sm edge-from-select">
                                <option value="">-- 选择节点 --</option>
                            </select>
                        </div>
                        <div class="form-group col-md-5">
                            <label>到节点</label>
                            <select class="form-control form-control-sm edge-to-select">
                                <option value="">-- 选择节点 --</option>
                            </select>
                        </div>
                        <div class="form-group col-md-2">
                            <label>优先级</label>
                            <input type="number" class="form-control form-control-sm edge-priority-input" 
                                   value="${edge.priority || 0}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>条件表达式</label>
                        <input type="text" class="form-control form-control-sm edge-expression-input" 
                               value="${edge.expression || ''}" 
                               placeholder="例如: \${node1_status} == 'SUCCESS'">
                    </div>
                    <i class="fas fa-times delete-btn edge-delete-btn"></i>
                </div>`);
                
                // 填充节点选择器
                updateEdgeNodeSelectors(edgeItem, edge.fromNodeId, edge.toNodeId);
                
                // 删除按钮事件
                edgeItem.find('.edge-delete-btn').click(function() {
                    edgeItem.remove();
                    updateEdgesJson();
                });
                
                // 输入框变化事件
                edgeItem.find('input, select').change(function() {
                    updateEdgesJson();
                });
                
                container.append(edgeItem);
                updateEdgesJson();
            }
            
            // 初始化工作流节点编辑器
            function initWorkflowEditors() {
                // 添加工作流节点
                $('#add-workflow-node-btn').click(function() {
                    addWorkflowNodeItem({
                        nodeId: 'node' + new Date().getTime(),
                        taskConfigId: '',
                        nodeName: '新节点',
                        parameters: {}
                    });
                });
                
                // 添加工作流转换边
                $('#add-workflow-edge-btn').click(function() {
                    addWorkflowEdgeItem({
                        fromNodeId: '',
                        toNodeId: '',
                        priority: 0,
                        expression: ''
                    });
                });
                
                // 工作流JSON数据变化时更新编辑器
                $('#workflowNodesJson').on('change', function() {
                    try {
                        const nodesData = JSON.parse($(this).val() || '[]');
                        $('.workflow-nodes-container').empty();
                        nodesData.forEach(node => {
                            addWorkflowNodeItem(node);
                        });
                    } catch (e) {
                        console.error('Error parsing workflow nodes JSON:', e);
                    }
                });
                
                $('#workflowEdgesJson').on('change', function() {
                    try {
                        const edgesData = JSON.parse($(this).val() || '[]');
                        $('.workflow-edges-container').empty();
                        edgesData.forEach(edge => {
                            addWorkflowEdgeItem(edge);
                        });                    } catch (e) {
                        console.error('解析工作流边JSON出错:', e);
                    }
                });
            }

            // Show/hide type-specific fields based on selection
            $('#taskType').change(function() {
                const type = $(this).val();
                        $('.type-specific-fields').hide();
                        $('#beanName, #methodName, #beanParameters').closest('.form-group').show(); // Default visibility for bean params

                        if (type === '0') { // Bean Task
                            $('#beanTaskFields').show();
                        } else if (type === '4') { // Shell Script Task (was 1)
                            $('#shellTaskFields').show();
                             // Hide direct bean parameters for shell tasks as they use structured JSON in beanParameters
                            $('#beanName, #methodName').closest('.form-group').hide();
                            $('#beanParameters').closest('.form-group').hide(); // Hide the generic beanParameters textarea
                        } else if (type === '2') { // HTTP Task
                            $('#httpTaskFields').show();
                            // Hide direct bean parameters for HTTP tasks
                            $('#beanName, #methodName').closest('.form-group').hide();
                            $('#beanParameters').closest('.form-group').hide();
                        } else if (type === '10') { // Workflow Task (was 3)
                            $('#workflowTaskFields').show();
                            $('#beanName, #methodName, #beanParameters').closest('.form-group').hide();
                        }
                    }).trigger('change');            // 初始加载页面时获取表单数据
            loadFormData();
            
            // 初始化工作流编辑器
            initWorkflowEditors();
              // 添加Cron表达式验证
            $('#cronExpression').on('blur', validateCronExpression);
              // 添加增强的日期时间验证
            function validateTaskDateRange() {
                return validateDateTimeRange('#startDate', '#endDate', '#dateRangeValidation');
            }
            
            // 绑定日期验证到输入事件
            $('#startDate, #endDate').on('change input blur', function() {
                validateTaskDateRange();
            });
            
            $('#addTaskBtn').click(function() {
                $('#taskFormModalLabel').text('添加任务');
                $('#task-form')[0].reset();
                $('#taskId').val('');
                $('#executeTimeoutSeconds').val(0); // Default timeout
                $('#isActive').prop('checked', true); // Default to active
                $('#taskType').trigger('change');
                  // 清除验证消息
                $('#dateRangeValidation').empty();
                
                // 清空工作流编辑器
                $('.workflow-nodes-container').empty();
                $('.workflow-edges-container').empty();
                
                // 清空验证提示
                $('#cronValidation').remove();
            });            $('#task-form').submit(function(event) {
                event.preventDefault();
                  // 提交前验证日期范围
                if (!validateTaskDateRange()) {
                    showFeedback('请修正日期时间范围错误后再提交', true);
                    return; // 如果验证失败，阻止表单提交
                }
                
                const taskId = $('#taskId').val();const taskData = {
                    taskName: $('#taskName').val(),
                    taskGroup: $('#taskGroup').val(),
                    cronExpression: $('#cronExpression').val(),
                    description: $('#description').val(),
                    executionMode: $('#executionMode').val(), // Added
                    taskType: parseInt($('#taskType').val()),
                    isActive: $('#isActive').is(':checked'),

                    // Common fields for BEAN tasks (type 0)
                    beanName: $('#beanName').val(),
                    methodName: $('#methodName').val(),
                    // beanParameters will be populated based on task type below                    // Advanced settings (common to all)                    // 使用工具函数处理HTML5 datetime-local格式的日期时间
                    startDate: parseInputDateTime($('#startDate').val()),
                    endDate: parseInputDateTime($('#endDate').val()),
                    taskCalendarGroup: $('#taskCalendarGroup').val() || null,
                    taskExcludeTimes: $('#taskExcludeTimes').val() || null,
                    executeTimeoutSeconds: parseInt($('#executeTimeoutSeconds').val()) || 0,
                    notifySuccessUserIds: $('#notifySuccessUserIds').val() ? $('#notifySuccessUserIds').val().join(',') : null,
                    notifyFailedUserIds: $('#notifyFailedUserIds').val() ? $('#notifyFailedUserIds').val().join(',') : null,

                    // Workflow specific fields (as List<WorkflowNode>, List<WorkflowEdge> in DTO)
                    // The controller will convert these from JSON strings if they are sent as such.
                    // Or, if the DTO expects lists, parse them here.
                    // For now, assume the controller handles TaskConfigDto which has List<...>
                    workflowNodes: null, // Will be populated for workflow type
                    workflowEdges: null,
                    globalParameters: null
                };

                // Populate beanParameters based on task type
                if (taskData.taskType === 0) { // Bean
                    taskData.beanParameters = $('#beanParameters').val();
                } else if (taskData.taskType === 4) { // Shell (was 1)
                    const shellParams = {
                        script: $('#shellScriptContent').val(),
                        isInlineScript: $('#shellIsInlineScript').is(':checked'),
                        arguments: ($('#shellArguments').val() || '').split('\n').map(arg => arg.trim()).filter(arg => arg.length > 0),
                        workingDirectory: $('#shellWorkingDirectory').val() || null
                    };
                    taskData.beanParameters = JSON.stringify(shellParams);
                    taskData.beanName = null; taskData.methodName = null; // Not used for Shell type directly
                } else if (taskData.taskType === 2) { // HTTP
                    const httpParams = {
                        url: $('#httpUrl').val(),
                        method: $('#httpMethod').val(),
                        headers: parseJsonOrNull($('#httpHeaders').val()) || {},
                        body: $('#httpBody').val() || null,
                        connectTimeout: parseJsonOrNull($('#httpConnectTimeout').val()),
                        readTimeout: parseJsonOrNull($('#httpReadTimeout').val())
                    };
                    taskData.beanParameters = JSON.stringify(httpParams);
                    taskData.beanName = null; taskData.methodName = null; // Not used for HTTP type directly
                } else if (taskData.taskType === 10) { // Workflow (was 3)
                    taskData.workflowNodes = parseJsonOrNull($('#workflowNodesJson').val());
                    taskData.workflowEdges = parseJsonOrNull($('#workflowEdgesJson').val());
                    taskData.globalParameters = parseJsonOrNull($('#globalParametersJson').val());
                    taskData.beanName = null; taskData.methodName = null; taskData.beanParameters = null; // Not used for Workflow parent
                }                const method = taskId ? 'PUT' : 'POST';
                const endpoint = taskId ? `/tasks/${taskId}` : '/tasks';

                makeApiCall(method, endpoint, taskData,
                    function(response) {
                        $('#taskFormModal').modal('hide');
                        showFeedback('任务保存成功！', false);
                        loadTasks();
                    },
                    function(jqXHR) {
                        showFeedback('保存任务失败: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );            });

            // Edit button
            $('#tasks-table-body').on('click', '.edit-btn', function() {
                const taskId = $(this).data('id');
                makeApiCall('GET', `/tasks/${taskId}`, null,
                    function(task) {                        $('#taskFormModalLabel').text('编辑任务');
                        $('#taskId').val(task.taskId);
                        $('#taskName').val(task.taskName);
                        $('#taskGroup').val(task.taskGroup);
                        $('#cronExpression').val(task.cronExpression);
                        $('#description').val(task.description);
                        $('#executionMode').val(task.executionMode || 'BROADCAST'); // Added, default to BROADCAST if null
                        $('#taskType').val(task.taskType.toString()).trigger('change');
                        // 兼容处理isActive字段，支持task.isActive和task.active两种情况
                        const isActive = (task.isActive !== undefined) ? task.isActive : task.active;
                        $('#isActive').prop('checked', isActive);

                        // Populate common bean fields first
                        $('#beanName').val(task.beanName);
                        $('#methodName').val(task.methodName);

                        // Populate type-specific fields based on task.taskType
                        if (task.taskType === 0) { // Bean
                            $('#beanParameters').val(task.beanParameters);
                        } else if (task.taskType === 4) { // Shell (was 1)
                            if (task.beanParameters) {
                                try {
                                    const shellP = JSON.parse(task.beanParameters);
                                    $('#shellScriptContent').val(shellP.script);
                                    $('#shellIsInlineScript').prop('checked', shellP.isInlineScript || false);
                                    $('#shellArguments').val((shellP.arguments || []).join('\n'));
                                    $('#shellWorkingDirectory').val(shellP.workingDirectory);
                                } catch (e) {
                                    showFeedback('Error parsing Shell parameters: ' + e.message, true);
                                    $('#beanParameters').val(task.beanParameters); // Show raw if parse fails
                                }
                            }
                        } else if (task.taskType === 2) { // HTTP
                             if (task.beanParameters) {
                                try {
                                    const httpP = JSON.parse(task.beanParameters);
                                    $('#httpUrl').val(httpP.url);
                                    $('#httpMethod').val(httpP.method);
                                    $('#httpHeaders').val(httpP.headers ? JSON.stringify(httpP.headers, null, 2) : '');
                                    $('#httpBody').val(httpP.body);
                                    $('#httpConnectTimeout').val(httpP.connectTimeout);
                                    $('#httpReadTimeout').val(httpP.readTimeout);
                                } catch (e) {
                                    showFeedback('Error parsing HTTP parameters: ' + e.message, true);
                                    $('#beanParameters').val(task.beanParameters); // Show raw if parse fails
                                }
                            }
                        } else if (task.taskType === 10) { // Workflow (was 3)
                            $('#workflowNodesJson').val(task.workflowNodes ? JSON.stringify(task.workflowNodes, null, 2) : '');
                            $('#workflowEdgesJson').val(task.workflowEdges ? JSON.stringify(task.workflowEdges, null, 2) : '');
                            $('#globalParametersJson').val(task.globalParameters ? JSON.stringify(task.globalParameters, null, 2) : '');
                            $('#beanParameters').val(''); // Clear generic beanParameters for workflow type
                        } else {
                             $('#beanParameters').val(task.beanParameters); // Fallback for unknown or simple bean tasks
                        }                    // Populate advanced settings                        // 使用工具函数格式化日期时间为HTML5 datetime-local格式
                        $('#startDate').val(formatDateTimeForInput(task.startDate));
                        $('#endDate').val(formatDateTimeForInput(task.endDate));
                        
                        // 调用验证函数确保日期时间状态一致
                        setTimeout(validateTaskDateRange, 100);
                        $('#taskCalendarGroup').val(task.taskCalendarGroup);
                        $('#taskExcludeTimes').val(task.taskExcludeTimes);
                        $('#executeTimeoutSeconds').val(task.executeTimeoutSeconds != null ? task.executeTimeoutSeconds : 0);
                        
                        // 设置多选下拉框
                        if (task.notifySuccessUserIds) {
                            const successUserIds = task.notifySuccessUserIds.split(',').map(id => id.trim());
                            $('#notifySuccessUserIds').val(successUserIds);
                        } else {
                            $('#notifySuccessUserIds').val([]);
                        }
                        
                        if (task.notifyFailedUserIds) {
                            const failedUserIds = task.notifyFailedUserIds.split(',').map(id => id.trim());
                            $('#notifyFailedUserIds').val(failedUserIds);
                        } else {
                            $('#notifyFailedUserIds').val([]);
                        }
                        
                        // 如果是工作流任务，初始化工作流编辑器
                        if (task.taskType === 10) {
                            // 清空工作流编辑器
                            $('.workflow-nodes-container').empty();
                            $('.workflow-edges-container').empty();
                            
                            // 解析并添加节点
                            if (task.workflowNodes) {
                                const nodes = Array.isArray(task.workflowNodes) 
                                    ? task.workflowNodes 
                                    : JSON.parse(task.workflowNodes);
                                nodes.forEach(node => addWorkflowNodeItem(node));
                            }
                            
                            // 解析并添加边
                            if (task.workflowEdges) {
                                const edges = Array.isArray(task.workflowEdges) 
                                    ? task.workflowEdges 
                                    : JSON.parse(task.workflowEdges);
                                edges.forEach(edge => addWorkflowEdgeItem(edge));
                            }
                        }

                        $('#taskFormModal').modal('show');
                    },                    function(jqXHR) {
                         showFeedback('获取任务详情失败: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Delete button
            $('#tasks-table-body').on('click', '.delete-btn', function() {
                const taskId = $(this).data('id');
                if (confirm('您确定要删除任务 ' + taskId + ' 吗?')) {
                    makeApiCall('DELETE', `/tasks/${taskId}`, null,
                        function() {
                            showFeedback('任务删除成功！', false);
                            loadTasks();
                        },                        function(jqXHR) {
                            showFeedback('删除任务失败: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });

            // Trigger button
            $('#tasks-table-body').on('click', '.trigger-btn', function() {
                const taskId = $(this).data('id');
                makeApiCall('POST', `/tasks/${taskId}/trigger`, null,
                    function() {
                        showFeedback('任务 ' + taskId + ' 触发成功！', false);
                    },
                    function(jqXHR) {
                        showFeedback('触发任务失败: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );            });
            
            // View logs button
            $('#tasks-table-body').on('click', '.view-logs-btn', function() {
                const taskId = $(this).data('id');
                const taskName = $(this).data('task-name');
                // 跳转到日志页面，带上任务ID和名称作为筛选条件
                window.location.href = `logs.html?taskId=${taskId}&taskName=${encodeURIComponent(taskName || '')}`;
            });
            
            // Enable/Disable buttons
            $('#tasks-table-body').on('click', '.enable-btn, .disable-btn', function() {
                const taskId = $(this).data('id');
                const isEnable = $(this).hasClass('enable-btn');
                const endpoint = `/tasks/${taskId}/${isEnable ? 'enable' : 'disable'}`;
                makeApiCall('POST', endpoint, null,
                    function() {
                        showFeedback(`任务 ${taskId} ${isEnable ? '启用' : '禁用'}成功！`, false);
                        loadTasks(); // Refresh table to show new status
                    },
                    function(jqXHR) {
                        showFeedback(`${isEnable ? '启用' : '禁用'}任务失败: ` + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });            function parseJsonOrNull(jsonString) {
                // 调用main.js中的安全JSON解析函数
                const result = safeParseJSON(jsonString);
                if (result === null && jsonString && jsonString.trim() !== '') {
                    // 如果解析失败且输入不为空，抛出错误以阻止表单提交
                    throw new Error('JSON格式无效，请检查语法');
                }
                return result;
            }
        });
    </script>
</body>
</html>
