<!DOCTYPE html>
<html lang="zh-CN">
<head>    <meta charset="UTF-8">
    <title>用户管理 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>用户管理</h2>
            <button class="btn btn-primary" data-toggle="modal" data-target="#userFormModal" id="addUserBtn">添加用户</button>
        </div>        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>Webhook地址</th>
                    <th>角色 (状态)</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <!-- User rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- User Form Modal -->
    <div class="modal fade" id="userFormModal" tabindex="-1" role="dialog" aria-labelledby="userFormModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">                <div class="modal-header">
                    <h5 class="modal-title" id="userFormModalLabel">添加/编辑用户</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="user-form">
                        <input type="hidden" id="userId">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="form-group">
                            <label for="webhookAddress">Webhook地址 (可选)</label>
                            <input type="url" class="form-control" id="webhookAddress" placeholder="https://example.com/webhook 或 URL数组的JSON">
                        </div>
                        <div class="form-group">
                            <label for="notificationPreferencesJson">通知偏好设置 (JSON - 可选)</label>
                            <textarea class="form-control" id="notificationPreferencesJson" rows="3" placeholder='例如: {"EMAIL": {"emailAddress": "user@example.com", "enabled": true}}'></textarea>
                            <small class="form-text text-muted">高级: 配置特定的通知渠道和详情。</small>
                        </div>
                        <div class="form-group" id="password-group">
                            <label for="password">密码</label>
                            <input type="password" class="form-control" id="password" placeholder="输入新密码或留空保持当前密码">
                            <small id="passwordHelp" class="form-text text-muted">新用户必填。现有用户可留空以保持当前密码。</small>
                        </div>
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="isAdmin">
                            <label class="form-check-label" for="isAdmin">管理员权限</label>
                        </div>
                        <button type="submit" class="btn btn-success">保存用户</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                 const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            });
            loadUsers();

            function loadUsers() {
                makeApiCall('GET', '/users', null,
                    function(users) {
                        const tableBody = $('#users-table-body');
                        tableBody.empty();
                        users.forEach(function(user) {
                            const role = user.isAdmin ? '<span class="badge badge-danger">Admin</span>' : '<span class="badge badge-primary">User</span>';
                            const webhookDisplay = user.webhookAddress ? user.webhookAddress.substring(0, 30) + (user.webhookAddress.length > 30 ? '...' : '') : '-';
                            const row = `<tr>
                                <td>${user.userId}</td>
                                <td>${user.username || ''}</td>
                                <td>${user.email || ''}</td>
                                <td title="${user.webhookAddress || ''}">${webhookDisplay}</td>
                                <td>${role}</td>
                                <td>${user.createTime ? new Date(user.createTime).toLocaleDateString() : ''}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-sm btn-info edit-btn" data-id="${user.userId}">Edit</button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${user.userId}">Delete</button>
                                </td>
                            </tr>`;
                            tableBody.append(row);
                        });
                    },
                    function(jqXHR) {
                        showFeedback('Error loading users: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            $('#addUserBtn').click(function() {
                $('#userFormModalLabel').text('Add User');
                $('#user-form')[0].reset();
                $('#userId').val('');
                $('#password').prop('required', true); // Password required for new user
                $('#passwordHelp').text('Required for new users.');
            });

            $('#user-form').submit(function(event) {
                event.preventDefault();
                const userId = $('#userId').val();
                const password = $('#password').val();

                if (!userId && (!password || password.trim() === '')) { // New user and password empty
                    showFeedback('Password is required for new users.', true);
                    return;
                }

                const userData = {
                    username: $('#username').val(),
                    email: $('#email').val(),
                    webhookAddress: $('#webhookAddress').val() || null,
                    notificationPreferencesJson: $('#notificationPreferencesJson').val() || null,
                    isAdmin: $('#isAdmin').is(':checked'),
                    // Password: only include if provided (for create or update)
                };
                if (password && password.trim() !== '') {
                    userData.password = password;
                }

                const method = userId ? 'PUT' : 'POST';
                const endpoint = userId ? `/users/${userId}` : '/users';

                makeApiCall(method, endpoint, userData,
                    function(response) {
                        $('#userFormModal').modal('hide');
                        showFeedback('User saved successfully!', false);
                        loadUsers();
                    },
                    function(jqXHR) {
                        showFeedback('Error saving user: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Edit button
            $('#users-table-body').on('click', '.edit-btn', function() {
                const userId = $(this).data('id');
                makeApiCall('GET', `/users/${userId}`, null,
                    function(user) {
                        $('#userFormModalLabel').text('Edit User');
                        $('#userId').val(user.userId);
                        $('#username').val(user.username);
                        $('#email').val(user.email);
                        $('#webhookAddress').val(user.webhookAddress);
                        $('#notificationPreferencesJson').val(user.notificationPreferencesJson);
                        $('#isAdmin').prop('checked', user.isAdmin);
                        $('#password').val(''); // Clear password field for edit
                        $('#password').prop('required', false); // Not required for edit unless changing
                        $('#passwordHelp').text('For existing users, leave blank to keep current password.');
                        $('#userFormModal').modal('show');
                    },
                    function(jqXHR) {
                        showFeedback('Error fetching user details: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Delete button
            $('#users-table-body').on('click', '.delete-btn', function() {
                const userId = $(this).data('id');
                // Ideally, prevent self-deletion or deletion of the last admin user.
                // This logic should be in the backend, but a frontend check can be a UX improvement.
                const currentUsername = localStorage.getItem('username');
                const usernameToDelete = $(this).closest('tr').find('td:nth-child(2)').text();
                if (currentUsername === usernameToDelete) {
                    showFeedback("You cannot delete your own user account.", true);
                    return;
                }

                if (confirm('Are you sure you want to delete user ' + userId + ' (' + usernameToDelete + ')?')) {
                    makeApiCall('DELETE', `/users/${userId}`, null,
                        function() {
                            showFeedback('User deleted successfully!', false);
                            loadUsers();
                        },
                        function(jqXHR) {
                            showFeedback('Error deleting user: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });
        });
    </script>
</body>
</html>
