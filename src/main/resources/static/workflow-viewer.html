<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>工作流查看器 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workflow-dag.css">
</head>

<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>工作流查看器</h2>
            <a href="tasks.html" class="btn btn-outline-secondary">返回任务列表</a>
        </div>

        <!-- 工作流信息卡 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">工作流信息</h5>
                <div id="workflow-status-badge" class="badge badge-secondary">未知</div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>工作流名称:</strong> <span id="workflow-name">--</span></p>
                        <p><strong>任务ID:</strong> <span id="workflow-task-id">--</span></p>
                        <p><strong>日志ID:</strong> <span id="workflow-log-id">--</span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>开始时间:</strong> <span id="workflow-start-time">--</span></p>
                        <p><strong>结束时间:</strong> <span id="workflow-end-time">--</span></p>
                        <p><strong>执行用时:</strong> <span id="workflow-duration">--</span></p>
                    </div>
                </div>
                <!-- 工作流全局参数 -->
                <div class="mt-3">
                    <h6>全局参数:</h6>
                    <pre id="workflow-globals" class="bg-light p-2 rounded">无全局参数</pre>
                </div>
            </div>
        </div>

        <!-- 工作流DAG图显示 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">工作流DAG图</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    下图展示工作流中所有任务的依赖关系和执行状态，点击节点可查看详细信息。
                </div>
                <div class="workflow-dag-container" id="workflow-dag-view"></div>
            </div>
        </div>

        <!-- 工作流执行步骤列表 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">执行步骤</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>步骤</th>
                            <th>节点名称</th>
                            <th>任务类型</th>
                            <th>开始时间</th>
                            <th>执行时长</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="workflow-steps-table">
                        <tr>
                            <td colspan="7" class="text-center">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 步骤详情模态框 -->
        <div class="modal fade" id="stepDetailModal" tabindex="-1" role="dialog" aria-labelledby="stepDetailModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="stepDetailModalLabel">步骤详情</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body" id="step-detail-content">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS 库 -->
    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="libs/cytoscape/cytoscape.min.js"></script>
    <script src="libs/cytoscape/layout/cytoscape-dagre.js"></script>
    <script src="js/cytoscape-setup.js"></script>
    <script src="js/workflow-safety.js"></script>
    <script src="js/workflow-utils.js"></script>
    <script src="js/workflow-dag.js"></script>
    <script src="js/workflow-initializer.js"></script>
    <script src="js/main.js"></script>

    <script>
        $(document).ready(function () {
            // 加载导航栏
            $("#navbar-container").load("_navbar.html", function () {
                // 设置当前页面的导航项为活跃状态
                $(".nav-item a[href='tasks.html']").addClass("active");
            });

            // 从URL获取日志ID
            const urlParams = new URLSearchParams(window.location.search);
            const logId = urlParams.get('logId');

            if (!logId) {
                showFeedback('未提供日志ID，无法查看工作流', true);
                return;
            }

            // 初始化DAG图
            let workflowDag = null;

            // 加载工作流数据
            loadWorkflowData(logId);

            // 加载工作流数据
            function loadWorkflowData(logId) {
                // 调用API获取工作流执行数据
                makeApiCall('GET', `/tasks/logs/${logId}/workflow`, null,
                    function (data) {
                        displayWorkflowData(data);
                    },
                    function (error) {
                        showFeedback(`加载工作流数据失败: ${error.statusText || '未知错误'}`, true);
                    }
                );
            }

            // 显示工作流数据
            function displayWorkflowData(data) {
                if (!data) {
                    showFeedback('获取到的工作流数据为空', true);
                    return;
                }

                // 填充工作流基本信息
                $('#workflow-name').text(data.workflowName || '--');
                $('#workflow-task-id').text(data.taskId || '--');
                $('#workflow-log-id').text(data.logId || '--');

                // 格式化时间
                const startTime = data.startTime ? new Date(data.startTime).toLocaleString() : '--';
                const endTime = data.endTime ? new Date(data.endTime).toLocaleString() : '--';
                $('#workflow-start-time').text(startTime);
                $('#workflow-end-time').text(endTime);

                // 计算执行时长
                if (data.startTime && data.endTime) {
                    const duration = (new Date(data.endTime) - new Date(data.startTime)) / 1000; // 秒
                    $('#workflow-duration').text(formatDuration(duration));
                } else {
                    $('#workflow-duration').text('--');
                }

                // 设置状态
                const statusBadge = $('#workflow-status-badge');
                statusBadge.text(data.state || '未知');
                statusBadge.removeClass('badge-secondary badge-success badge-danger badge-warning badge-info');

                switch (data.state) {
                    case 'SUCCESS':
                        statusBadge.addClass('badge-success');
                        break;
                    case 'FAILED':
                        statusBadge.addClass('badge-danger');
                        break;
                    case 'RUNNING':
                        statusBadge.addClass('badge-info');
                        break;
                    case 'TIMED_OUT':
                        statusBadge.addClass('badge-warning');
                        break;
                    default:
                        statusBadge.addClass('badge-secondary');
                }

                // 显示全局参数
                if (data.globalParameters && Object.keys(data.globalParameters).length > 0) {
                    $('#workflow-globals').text(JSON.stringify(data.globalParameters, null, 2));
                }

                // 填充步骤表格
                displayWorkflowSteps(data.steps || []);

                // 初始化并更新DAG图
                initWorkflowDag(data);
            }

            // 显示工作流步骤
            function displayWorkflowSteps(steps) {
                const tbody = $('#workflow-steps-table');
                tbody.empty();

                if (!steps.length) {
                    tbody.html('<tr><td colspan="7" class="text-center">无执行步骤</td></tr>');
                    return;
                }

                steps.forEach((step, index) => {
                    const startTime = step.startTime ? new Date(step.startTime).toLocaleString() : '--';
                    const duration = (step.startTime && step.endTime)
                        ? formatDuration((new Date(step.endTime) - new Date(step.startTime)) / 1000)
                        : '--';

                    // 状态标签
                    let statusClass;
                    switch (step.state) {
                        case 'SUCCESS': statusClass = 'badge-success'; break;
                        case 'FAILED': statusClass = 'badge-danger'; break;
                        case 'RUNNING': statusClass = 'badge-info'; break;
                        case 'TIMED_OUT': statusClass = 'badge-warning'; break;
                        default: statusClass = 'badge-secondary';
                    }

                    const row = `
                        <tr data-step-id="${step.logId}" data-node-id="${step.nodeId}">
                            <td>${index + 1}</td>
                            <td>${step.nodeName || step.nodeId || '--'}</td>
                            <td>${step.taskType || '--'}</td>
                            <td>${startTime}</td>
                            <td>${duration}</td>
                            <td><span class="badge ${statusClass}">${step.state || '未知'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-info view-step-details" data-log-id="${step.logId}">
                                    <i class="fas fa-eye"></i> 详情
                                </button>
                            </td>
                        </tr>
                    `;

                    tbody.append(row);
                });

                // 绑定查看详情按钮事件
                $('.view-step-details').on('click', function () {
                    const stepLogId = $(this).data('log-id');
                    viewStepDetails(stepLogId);
                });

                // 点击行高亮相应节点
                $('#workflow-steps-table tr').on('click', function () {
                    const nodeId = $(this).data('node-id');
                    if (nodeId && workflowDag && workflowDag.cy) {
                        // 高亮节点
                        workflowDag.cy.elements().removeClass('highlighted').addClass('faded');
                        const node = workflowDag.cy.$id(nodeId);
                        if (node.length) {
                            node.removeClass('faded').addClass('highlighted');
                            workflowDag.cy.center(node);
                        }
                    }
                });
            }

            // 查看步骤详情
            function viewStepDetails(stepLogId) {
                $('#stepDetailModal').modal('show');
                $('#step-detail-content').html(`
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                    </div>
                `);

                // 调用API获取步骤详情
                makeApiCall('GET', `/tasks/logs/${stepLogId}`, null,
                    function (data) {
                        displayStepDetails(data);
                    },
                    function (error) {
                        $('#step-detail-content').html(`
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-circle"></i> 
                                加载步骤详情失败: ${error.statusText || '未知错误'}
                            </div>
                        `);
                    }
                );
            }

            // 显示步骤详情
            function displayStepDetails(data) {
                if (!data) {
                    $('#step-detail-content').html(`
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle"></i> 无步骤详情数据
                        </div>
                    `);
                    return;
                }

                // 格式化时间
                const startTime = data.startTime ? new Date(data.startTime).toLocaleString() : '--';
                const endTime = data.endTime ? new Date(data.endTime).toLocaleString() : '--';

                // 构建详情HTML
                let html = `
                    <div class="step-details">
                        <h6>基本信息</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>日志ID:</strong> ${data.logId || '--'}</p>
                                <p><strong>任务ID:</strong> ${data.taskId || '--'}</p>
                                <p><strong>节点ID:</strong> ${data.nodeId || '--'}</p>
                                <p><strong>节点名称:</strong> ${data.nodeName || '--'}</p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>开始时间:</strong> ${startTime}</p>
                                <p><strong>结束时间:</strong> ${endTime}</p>
                                <p><strong>状态:</strong> ${data.state || '--'}</p>
                                <p><strong>执行实例:</strong> ${data.instanceId || '--'}</p>
                            </div>
                        </div>
                `;

                // 添加输入参数
                if (data.parameters) {
                    html += `
                        <h6 class="mt-3">输入参数</h6>
                        <pre class="bg-light p-2 rounded">${JSON.stringify(data.parameters, null, 2)}</pre>
                    `;
                }

                // 添加执行信息
                if (data.output || data.message) {
                    html += `
                        <h6 class="mt-3">执行结果</h6>
                    `;

                    if (data.output) {
                        html += `
                            <div class="mb-2">
                                <strong>输出:</strong>
                                <pre class="bg-light p-2 rounded">${data.output}</pre>
                            </div>
                        `;
                    }

                    if (data.message) {
                        html += `
                            <div>
                                <strong>消息:</strong>
                                <pre class="bg-light p-2 rounded">${data.message}</pre>
                            </div>
                        `;
                    }
                }

                html += '</div>';

                $('#step-detail-content').html(html);
            }

            // 初始化工作流DAG图
            function initWorkflowDag(data) {
                try {
                    // 安全处理节点和边
                    // 首先尝试使用安全解析工具
                    let nodes = [], edges = [];
                    
                    if (typeof window.safeFormatWorkflowJSON === 'function') {
                        console.log('使用安全JSON工具处理工作流图数据');
                        nodes = window.safeFormatWorkflowJSON(data.nodes || [], 'nodes');
                        edges = window.safeFormatWorkflowJSON(data.edges || [], 'edges');
                    } else {
                        console.log('使用标准方式处理工作流图数据');
                        nodes = data.nodes || [];
                        edges = data.edges || [];
                    }
                    
                    // 防御性检查确保数据类型
                    if (!Array.isArray(nodes)) nodes = [];
                    if (!Array.isArray(edges)) edges = [];
                    
                    // 准备节点状态映射
                    const nodeStatusMap = {};
                    if (Array.isArray(data.steps) && data.steps.length) {
                        data.steps.forEach(step => {
                            if (step && step.nodeId) {
                                nodeStatusMap[step.nodeId] = step.state || 'UNKNOWN';
                            }
                        });
                    }
                    
                    // 初始化DAG图
                    if (typeof WorkflowDagViewer !== 'undefined') {
                    workflowDag = new WorkflowDagViewer('workflow-dag-view', {
                        readOnly: true,
                        nodeStatusMap: nodeStatusMap,
                        onNodeClick: function (nodeData) {
                            // 查找对应的步骤并高亮表格行
                            const nodeId = nodeData.nodeId;
                            $(`#workflow-steps-table tr`).removeClass('table-active');
                            $(`#workflow-steps-table tr[data-node-id="${nodeId}"]`).addClass('table-active');

                            // 可以滚动到对应行
                            const row = $(`#workflow-steps-table tr[data-node-id="${nodeId}"]`)[0];
                            if (row) {
                                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    });

                    workflowDag.updateData(nodes, edges);
                } else {
                    console.error('WorkflowDagViewer 未定义');
                    $('#workflow-dag-view').html(`
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle"></i> 
                            无法加载DAG图组件。请确认所有必要的JavaScript库已正确加载。
                        </div>
                    `);
                }
                } catch (e) {
                    console.error('工作流DAG图初始化失败:', e);
                    $('#workflow-dag-view').html(`
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle"></i> 
                            工作流DAG图初始化失败: ${e.message || '未知错误'}
                        </div>
                    `);
                }
            }

            // 格式化持续时间，将秒转换为人类可读格式
            function formatDuration(seconds) {
                if (isNaN(seconds) || seconds < 0) {
                    return '--';
                }

                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const remainingSeconds = Math.floor(seconds % 60);

                let result = '';

                if (hours > 0) {
                    result += `${hours}小时 `;
                }
                if (minutes > 0 || hours > 0) {
                    result += `${minutes}分钟 `;
                }
                result += `${remainingSeconds}秒`;

                return result;
            }
        });
    </script>
</body>

</html>
