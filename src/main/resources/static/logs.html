<!DOCTYPE html>
<html lang="zh-CN">
<head>    <meta charset="UTF-8">
    <title>任务日志 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <h2 class="my-3">任务执行日志</h2>
        <div class="form-group">
            <label for="taskIdFilter">按任务ID筛选 (可选):</label>
            <input type="number" class="form-control" id="taskIdFilter" placeholder="输入任务ID">
        </div>        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>日志ID</th>
                    <th>任务ID</th>
                    <th>状态</th>
                    <th>执行实例</th>
                    <th>开始时间</th>
                    <th>结束时间</th>
                    <th>消息</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
                <!-- Log rows will be inserted here -->
            </tbody>
        </table>
        <nav aria-label="Page navigation">
            <ul class="pagination" id="pagination-controls">
                <!-- Pagination controls will be inserted here -->
            </ul>
        </nav>
    </div>

    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script>      
     $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                 const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            });

            let allLogs = [];
            let currentPage = 1;
            const rowsPerPage = 10;
            
            // 获取URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const taskIdParam = urlParams.get('taskId');
            const taskNameParam = urlParams.get('taskName');

            function displayLogs(logsToDisplay) {
                const tableBody = $('#logs-table-body');
                tableBody.empty();

                const startIndex = (currentPage - 1) * rowsPerPage;
                const endIndex = startIndex + rowsPerPage;
                const paginatedItems = logsToDisplay.slice(startIndex, endIndex);

                paginatedItems.forEach(function(log) {
                    const row = `<tr>
                        <td>${log.logId}</td>
                        <td>${log.taskId}</td>
                        <td><span class="badge ${getBadgeClass(log.state)}">${log.state || ''}</span></td>
                        <td>${log.instanceId || ''}</td>                        <td>${formatDateTime(log.startTime)}</td>
                        <td>${formatDateTime(log.endTime)}</td>
                        <td><small>${log.exMsg || '-'}</small></td>
                    </tr>`;
                    tableBody.append(row);
                });
                setupPagination(logsToDisplay.length);
            }

            function getBadgeClass(state) {
                if (!state) return 'badge-secondary';
                switch(state.toUpperCase()) {
                    case 'SUCCESS': return 'badge-success';
                    case 'FAILED': return 'badge-danger';
                    case 'RUNNING': return 'badge-info';
                    case 'SKIPPED': return 'badge-warning';
                    default: return 'badge-secondary';
                }
            }

            function setupPagination(totalItems) {
                const pageCount = Math.ceil(totalItems / rowsPerPage);
                const paginationControls = $('#pagination-controls');
                paginationControls.empty();

                if (pageCount <= 1) return;

                // Previous button
                paginationControls.append(
                    `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage - 1}">上一页</a>
                    </li>`
                );

                // Page numbers (simplified: show a few pages around current)
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(pageCount, currentPage + 2);

                if (startPage > 1) {
                    paginationControls.append('<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>');
                    if (startPage > 2) {
                         paginationControls.append('<li class="page-item disabled"><span class="page-link">...</span></li>');
                    }
                }

                for (let i = startPage; i <= endPage; i++) {
                    paginationControls.append(
                        `<li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>`
                    );
                }

                if (endPage < pageCount) {
                    if (endPage < pageCount -1) {
                         paginationControls.append('<li class="page-item disabled"><span class="page-link">...</span></li>');
                    }
                    paginationControls.append(`<li class="page-item"><a class="page-link" href="#" data-page="${pageCount}">${pageCount}</a></li>`);
                }


                // Next button
                paginationControls.append(
                    `<li class="page-item ${currentPage === pageCount ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage + 1}">下一页</a>
                    </li>`
                );
            }

            $('#pagination-controls').on('click', '.page-link', function(e) {
                e.preventDefault();
                const page = $(this).data('page');
                if (page && page !== currentPage) {
                    currentPage = page;
                    const taskId = $('#taskIdFilter').val();
                    const logsToDisplay = taskId ? allLogs.filter(log => log.taskId == taskId) : allLogs;
                    displayLogs(logsToDisplay);
                }
            });            function loadLogs(taskId = null) {
                currentPage = 1; // Reset to first page on new load/filter
                const endpoint = taskId ? `/logs/task/${taskId}` : '/logs';
                // The API as designed doesn't support server-side pagination for /logs or /logs/task/{taskId}
                // It fetches all. So we'll store them and paginate client-side.
                makeApiCall('GET', endpoint, null,
                    function(logs) {
                        allLogs = logs.sort((a,b) => b.logId - a.logId); // Sort by ID desc by default
                        displayLogs(allLogs);
                    },
                    function(jqXHR) {
                        showFeedback('加载日志出错: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            $('#taskIdFilter').on('keyup', function(e) {
                if (e.key === 'Enter' || $(this).val() === '') {
                    const taskId = $(this).val();
                    if (taskId && taskId.trim() !== "") {
                        // Filter existing logs if allLogs is comprehensive, or reload specific
                        // For now, let's assume the API /logs returns ALL logs, and /logs/task/{id} returns specific.
                        // If we want to filter client-side from a global list:
                        // const filteredLogs = allLogs.filter(log => log.taskId == taskId);
                        // displayLogs(filteredLogs);
                        // Or, if API for /logs/task/{id} is preferred for filtering:
                        loadLogs(taskId);
                    } else if (!taskId || taskId.trim() === "") {
                        loadLogs(); // Load all if filter is cleared
                    }
                }
            });            // 如果URL包含任务ID参数，直接填充过滤框
            if (taskIdParam) {
                $('#taskIdFilter').val(taskIdParam);
                if (taskNameParam) {
                    // 如果有任务名称，在页面标题中显示
                    $('h2.my-3').text(`任务执行日志 - ${taskNameParam} (ID: ${taskIdParam})`);
                }
                // 加载特定任务的日志
                loadLogs(taskIdParam);
            } else {
                // 初始加载所有日志
                loadLogs();
            }
        });
    </script>
</body>
</html>
