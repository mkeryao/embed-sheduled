<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>任务管理 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workflow-dag.css">
    
    <!-- 添加组件加载样式 -->
    <style>
        .component-loader {
            text-align: center;
            padding: 20px;
            border-radius: 5px;
            background-color: #f8f9fa;
            margin-bottom: 20px;
        }
        .component-loader i {
            margin-right: 10px;
            animation: spin 1s infinite linear;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .component-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .hidden-component {
            display: none;
        }
    </style>
    
    <!-- 全局错误处理脚本 -->
    <script>
        // 全局错误处理
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(`全局错误: ${message} (${source}:${lineno}:${colno})`);
            const errorInfo = `错误: ${message}\n位置: ${source}:${lineno}:${colno}`;
            
            // 如果错误发生在页面加载完成之后，显示错误信息
            if (document.readyState === 'complete') {
                showErrorMessage(errorInfo);
            } else {
                // 否则等待页面加载完成后显示
                window.addEventListener('load', () => {
                    showErrorMessage(errorInfo);
                });
            }
            
            return false; // 让浏览器继续处理错误
        };
        
        // 显示错误信息函数
        function showErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'component-error';
            errorDiv.innerHTML = `<h5>应用程序错误</h5><pre>${message}</pre>`;
            
            // 尝试在页面顶部插入错误消息
            const container = document.querySelector('.container');
            if (container) {
                container.insertBefore(errorDiv, container.firstChild);
            } else {
                document.body.insertBefore(errorDiv, document.body.firstChild);
            }
        }
    </script>
</head>

<body>
    <!-- 导航栏容器 -->
    <div id="navbar-container">
        <div class="component-loader">
            <i class="fas fa-spinner"></i> 正在加载导航栏...
        </div>
    </div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>任务管理</h2>
            <button class="btn btn-primary" data-toggle="modal" data-target="#taskFormModal"
                id="addTaskBtn">添加任务</button>
        </div>
        
        <!-- 任务数据加载指示器 -->
        <div id="tasks-loading" class="component-loader">
            <i class="fas fa-spinner"></i> 正在加载任务数据...
        </div>
        
        <!-- 任务表格 -->
        <table class="table table-striped table-hover tasks-table hidden-component">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>任务组</th>
                    <th>任务名称</th>
                    <th>CRON表达式</th>
                    <th>任务类型</th>
                    <th>有效时间</th>
                    <th>状态</th>
                    <th>执行模式</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tasks-table-body">
                <!-- 任务行将通过jQuery在这里插入 -->
            </tbody>
        </table>
    </div>

    <!-- 任务表单模态框容器 -->
    <div id="task-form-container">
        <div class="component-loader">
            <i class="fas fa-spinner"></i> 正在加载表单组件...
        </div>
    </div>
    
    <!-- 工作流编辑器组件容器（全局级别，用于工作流预览） -->
    <div id="workflow-editor-component" class="hidden-component">
        <div class="component-loader">
            <i class="fas fa-spinner"></i> 正在加载工作流编辑器...
        </div>
    </div>
    
    <!-- 脚本引用 -->
    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    
    <!-- 工作流相关脚本 -->
    <script src="libs/cytoscape/cytoscape.min.js"></script>
    <script src="libs/cytoscape/layout/cytoscape-dagre.js"></script>
    <script src="js/cytoscape-setup.js"></script>
    <script src="js/workflow-safety.js"></script>
    <script src="js/workflow-safe-fix.js"></script>
    <script src="js/workflow-utils.js"></script>
    <script src="js/workflow-dag.js"></script>
    <script src="js/workflow-node-edge-handler.js"></script>
    <script src="js/workflow-page-patch.js"></script>
    <script src="js/workflow-global-functions.js"></script>
    <script src="js/workflow-initializer.js"></script>
    
    <!-- 组件加载和业务逻辑脚本 -->
    <script src="js/tasks-script.js"></script>
</body>

</html>
