<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日历管理 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>日历管理</h2>
            <button class="btn btn-primary" data-toggle="modal" data-target="#calendarFormModal" id="addCalendarBtn">添加日历</button>
        </div>
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>日历名称 (组)</th>
                    <th>描述 (备注)</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="calendars-table-body">
                <!-- Calendar rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Calendar Form Modal (for TaskCalendar) -->
    <div class="modal fade" id="calendarFormModal" tabindex="-1" role="dialog" aria-labelledby="calendarFormModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">                <div class="modal-header">
                    <h5 class="modal-title" id="calendarFormModalLabel">添加/编辑日历</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="calendar-form">
                        <input type="hidden" id="calendarId">
                        <div class="form-group">
                            <label for="calendarName">日历名称 (组)</label>
                            <input type="text" class="form-control" id="calendarName" required>
                        </div>
                        <div class="form-group">
                            <label for="calendarDescription">描述 (备注)</label>
                            <textarea class="form-control" id="calendarDescription" rows="2"></textarea>
                        </div>                        <button type="submit" class="btn btn-success">保存日历</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Calendar Days Management Modal (for TaskCalendarDay) -->
    <div class="modal fade" id="calendarDaysModal" tabindex="-1" role="dialog" aria-labelledby="calendarDaysModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="calendarDaysModalLabel">管理日历日期 - <span id="daysModalCalendarName"></span></h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="currentCalendarIdForDays">
                    <h5>添加新日期条目</h5>
                    <form id="calendar-day-form" class="form-inline mb-3">
                        <div class="form-group mr-2">
                            <label for="eventDate" class="sr-only">日期</label>
                            <input type="date" class="form-control" id="eventDate" placeholder="事件日期" required>
                        </div>
                        <div class="form-group mr-2">
                            <label for="dayDescription" class="sr-only">描述</label>
                            <input type="text" class="form-control" id="dayDescription" placeholder="日期描述">
                        </div>
                        <div class="form-check mr-2">
                            <input class="form-check-input" type="checkbox" id="isWorkingDay" checked>
                            <label class="form-check-label" for="isWorkingDay">
                                是工作日？
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">添加日期</button>
                    </form>
                    <hr/>
                    <h5>已有日期</h5>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>描述</th>
                                <th>工作日？</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="calendar-days-list">
                            <!-- Day entries will be listed here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                 const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            });
            loadCalendars();            function loadCalendars() {
                makeApiCall('GET', '/calendars', null,
                    function(calendars) {
                        const tableBody = $('#calendars-table-body');
                        tableBody.empty();
                        calendars.forEach(function(calendar) {                            const row = `<tr>
                                <td>${calendar.calendarId}</td>
                                <td>${calendar.calendarName || ''}</td>
                                <td>${calendar.description || ''}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-sm btn-info manage-days-btn" data-id="${calendar.calendarId}" data-name="${calendar.calendarName}">管理日期</button>
                                    <button class="btn btn-sm btn-danger delete-calendar-btn" data-id="${calendar.calendarId}">删除日历</button>
                                </td>
                            </tr>`;
                            tableBody.append(row);
                        });
                    },
                    function(jqXHR) {
                        showFeedback('加载日历出错: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            $('#addCalendarBtn').click(function() {
                $('#calendarFormModalLabel').text('添加日历');
                $('#calendar-form')[0].reset();
                $('#calendarId').val('');
            });

            $('#calendar-form').submit(function(event) {
                event.preventDefault();
                const calendarId = $('#calendarId').val(); // 当前不使用编辑日历功能，仅添加。
                const calendarData = {
                    calendarName: $('#calendarName').val(),
                    description: $('#calendarDescription').val(),
                    // days: [] // 日期在日历创建后单独管理，简化界面
                };

                // 对于这个简化的UI，我们不支持编辑日历名称/描述。
                // 只能添加。如果需要编辑，它将类似于任务。
                if (calendarId) {
                     showFeedback('此UI版本不支持编辑现有日历。', true);
                     return;                }                
                makeApiCall('POST', '/calendars', calendarData,
                    function(response) {
                        $('#calendarFormModal').modal('hide');
                        showFeedback('日历保存成功！', false);
                        loadCalendars();
                    },
                    function(jqXHR) {
                        showFeedback('保存日历出错: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });            // Delete Calendar
            $('#calendars-table-body').on('click', '.delete-calendar-btn', function() {
                const calId = $(this).data('id');
                if (confirm('您确定要删除日历 ' + calId + ' 吗？这也将删除其所有日期条目。')) {
                    makeApiCall('DELETE', `/calendars/${calId}`, null,
                        function() {
                            showFeedback('日历删除成功！', false);
                            loadCalendars();
                        },
                        function(jqXHR) {
                            showFeedback('删除日历出错: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });

            // --- Manage Calendar Days ---
            let currentManagingCalendarId = null;

            $('#calendars-table-body').on('click', '.manage-days-btn', function() {
                currentManagingCalendarId = $(this).data('id');
                const calendarName = $(this).data('name');
                $('#daysModalCalendarName').text(calendarName);
                $('#currentCalendarIdForDays').val(currentManagingCalendarId);
                loadCalendarDays(currentManagingCalendarId);
                $('#calendarDaysModal').modal('show');
            });            function loadCalendarDays(calendarId) {
                makeApiCall('GET', `/calendars/${calendarId}/days`, null,
                    function(days) {
                        const daysList = $('#calendar-days-list');
                        daysList.empty();
                        if (days && days.length > 0) {
                            days.forEach(function(day) {
                                const row = `<tr>
                                    <td>${day.eventDate}</td>
                                    <td>${day.description || '-'}</td>
                                    <td>${day.isWorkingDay ? '是' : '否'}</td>
                                    <td><button class="btn btn-xs btn-danger delete-day-btn" data-day-id="${day.dayId}">删除</button></td>
                                </tr>`;
                                daysList.append(row);
                            });
                        } else {
                            daysList.append('<tr><td colspan="4">该日历没有日期条目。</td></tr>');
                        }
                    },
                    function(jqXHR) {
                        $('#calendar-days-list').html('<tr><td colspan="4">加载日期出错。</td></tr>');
                        showFeedback('加载日历日期出错: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            $('#calendar-day-form').submit(function(event) {
                event.preventDefault();
                const calendarId = $('#currentCalendarIdForDays').val();
                if (!calendarId) {
                    showFeedback('No calendar selected for adding day.', true);
                    return;
                }
                const dayData = {
                    eventDate: $('#eventDate').val(),
                    description: $('#dayDescription').val(),
                    isWorkingDay: $('#isWorkingDay').is(':checked')
                };

                makeApiCall('POST', `/calendars/${calendarId}/days`, dayData,
                    function(response) {
                        showFeedback('Day entry added successfully!', false);
                        loadCalendarDays(calendarId); // Refresh list
                        $('#calendar-day-form')[0].reset();
                    },
                    function(jqXHR) {
                         let msg = 'Error adding day entry.';
                         if (jqXHR.status === 409) msg = 'Day entry for this date already exists.';
                         else if(jqXHR.responseJSON && jqXHR.responseJSON.message) msg = jqXHR.responseJSON.message;
                         showFeedback(msg, true);
                    }
                );
            });

            $('#calendar-days-list').on('click', '.delete-day-btn', function() {
                const dayId = $(this).data('day-id');
                const calendarId = $('#currentCalendarIdForDays').val();
                if (confirm('Are you sure you want to delete this day entry?')) {
                    makeApiCall('DELETE', `/calendars/${calendarId}/days/${dayId}`, null,
                        function() {
                            showFeedback('Day entry deleted successfully!', false);
                            loadCalendarDays(calendarId); // Refresh list
                        },
                        function(jqXHR) {
                            showFeedback('Error deleting day entry: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });
        });
    </script>
</body>
</html>
