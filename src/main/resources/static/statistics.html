<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n-key="statisticsPage.title">Task Statistics - Task Scheduler</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/bootstrap-icons/css/bootstrap-icons.css">    <link rel="stylesheet" href="css/style.css">
    <script src="js/i18n.js"></script>
    <script src="locales/en.js"></script>
    <script src="locales/zh.js"></script>
    <script src="js/i18n-init.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <h2 class="my-3" data-i18n-key="statisticsPage.header">Task Execution Statistics</h2>
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header" data-i18n-key="statisticsPage.stats.globalCountsHeader">Global Statistics</div>
                    <div class="card-body" id="globalStatsBody">
                        <p class="text-muted" data-i18n-key="common.loading">Loading...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header" data-i18n-key="statisticsPage.stats.slowestTasksHeader">Top 5 Slowest Tasks (Avg. Success Execution Time)</div>
                    <div class="card-body" id="topSlowestTasksBody">
                        <p class="text-muted" data-i18n-key="common.loading">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-header" data-i18n-key="statisticsPage.stats.taskBreakdownHeader">Per-Task Success/Failure Counts</div>
            <div class="card-body" id="taskBreakdownBody">
                <p class="text-muted" data-i18n-key="common.loading">Loading...</p>
            </div>
        </div>
        <!-- Removed the <hr> as it might not be needed or can be added later if styling requires -->
    </div>

    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="libs/chartjs/chart.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            // 使用全局初始化函数
            if (typeof window.initializeI18n === 'function') {
                window.initializeI18n();
				console.log("i18n initialized for statistics.html");
				loadGlobalStats();
				loadTopSlowestTasks();
				loadTaskBreakdownStats();
            } else {
                console.error("全局i18n初始化函数未定义，尝试使用传统方式初始化");
                // 回退到直接调用i18n.init
                if (typeof i18n !== 'undefined') {
                    i18n.init();
					loadGlobalStats();
					loadTopSlowestTasks();
					loadTaskBreakdownStats();
                } else {
                    console.error("i18n对象未定义，无法初始化国际化");
                    // 最后的回退方案
                    loadGlobalStats();
                    loadTopSlowestTasks();
                    loadTaskBreakdownStats();
                }
            }

            $("#navbar-container").load("_navbar.html", function() {
                 const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) {
                    e.preventDefault();
                    logout();
                });
                if (typeof i18n !== 'undefined') { i18n.applyTranslations(); } // Apply to navbar
            });
        });

        // Utility function for status badges (duplicated from logs.html for now)
        function getBadgeClass(state) {
            if (!state) return 'badge-secondary';
            switch(state.toUpperCase()) {
                case 'SUCCESS': return 'badge-success';
                case 'FAILED': return 'badge-danger';
                case 'RUNNING': return 'badge-info';
                case 'SKIPPED': return 'badge-warning'; // Or 'badge-secondary'
                case 'TIMED_OUT': return 'badge-warning';
                case 'CANCELLED': return 'badge-dark';
                default: return 'badge-secondary';
            }
        }

        // Chart instances
        let globalCountsChart = null;
        let topSlowestTasksChart = null;
        let taskBreakdownChart = null;

        function loadGlobalStats() {
            $('#globalStatsBody').html(`<canvas id="globalCountsChart" width="100%" height="100"></canvas>`);
            makeApiCall('GET', '/logs/statistics/global-counts', null,
                function(data) {
                    const ctx = document.getElementById('globalCountsChart').getContext('2d');
                    const labels = [];
                    const counts = [];
                    const backgroundColors = [];
                    const colorMap = {
                        'SUCCESS': '#28a745',
                        'FAILED': '#dc3545',
                        'RUNNING': '#17a2b8',
                        'SKIPPED': '#ffc107',
                        'TIMED_OUT': '#ffc107',
                        'CANCELLED': '#343a40'
                    };
                    for (const state in data) {
                        labels.push(state);
                        counts.push(data[state]);
                        backgroundColors.push(colorMap[state] || '#6c757d');
                    }
                    if (globalCountsChart) {
                        globalCountsChart.destroy();
                    }
                    globalCountsChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: counts,
                                backgroundColor: backgroundColors
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                tooltip: {
                                    enabled: true
                                }
                            }
                        }
                    });
                },
                function(jqXHR) {
                    const errorMsg = i18n.translate('statisticsPage.feedback.errorLoadingGlobalStats', 'Failed to load global stats.');
                    $('#globalStatsBody').html(`<p class="text-danger">${errorMsg}</p>`);
                    console.error("Error loading global stats: ", jqXHR);
                }
            );
        }

        function loadTopSlowestTasks() {
            $('#topSlowestTasksBody').html(`<canvas id="topSlowestTasksChart" width="100%" height="150"></canvas>`);
            makeApiCall('GET', '/logs/statistics/top-avg-execution-time?limit=5', null,
                function(tasks) {
                    const ctx = document.getElementById('topSlowestTasksChart').getContext('2d');
                    const labels = [];
                    const durations = [];
                    if (tasks && tasks.length > 0) {
                        tasks.forEach(task => {
                            labels.push(`${task.task_name || 'N/A'} (ID: ${task.task_id})`);
                            durations.push(parseFloat(task.avg_duration_ms).toFixed(2));
                        });
                    }
                    if (topSlowestTasksChart) {
                        topSlowestTasksChart.destroy();
                    }
                    topSlowestTasksChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Avg Execution Time (ms)',
                                data: durations,
                                backgroundColor: '#007bff'
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            scales: {
                                x: {
                                    beginAtZero: true
                                }
                            },
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    enabled: true
                                }
                            }
                        }
                    });
                },
                function(jqXHR) {
                    const errorMsg = i18n.translate('statisticsPage.feedback.errorLoadingSlowestTasks', 'Failed to load slowest tasks data.');
                    $('#topSlowestTasksBody').html(`<p class="text-danger">${errorMsg}</p>`);
                    console.error("Error loading top slowest tasks: ", jqXHR);
                }
            );
        }

        function loadTaskBreakdownStats() {
            // Create a container with fixed height and scrollable content
            $('#taskBreakdownBody').html(`
                <div style="height: 400px; overflow-y: auto; overflow-x: hidden;">
                    <canvas id="taskBreakdownChart"></canvas>
                </div>
            `);
            makeApiCall('GET', '/logs/statistics/task-breakdown', null,
                function(tasks) {
                    const ctx = document.getElementById('taskBreakdownChart').getContext('2d');
                    const labels = [];
                    const successCounts = [];
                    const failedCounts = [];
                    if (tasks && tasks.length > 0) {
                        tasks.forEach(task => {
                            labels.push(`${task.task_name || 'N/A'} (ID: ${task.task_id})`);
                            successCounts.push(task.success_count);
                            failedCounts.push(task.failed_count);
                        });
                    }
                    
                    // Calculate dynamic height based on number of tasks
                    // Minimum 300px, maximum 800px, 40px per task
                    const dynamicHeight = Math.min(800, Math.max(300, tasks.length * 40));
                    
                    // Set canvas height
                    const canvas = document.getElementById('taskBreakdownChart');
                    canvas.height = dynamicHeight;
                    
                    if (taskBreakdownChart) {
                        taskBreakdownChart.destroy();
                    }
                    
                    // Calculate max value for Y-axis to prevent extreme scaling
                    const allCounts = [...successCounts, ...failedCounts];
                    const maxCount = Math.max(...allCounts);
                    const suggestedMax = Math.ceil(maxCount * 1.1); // Add 10% padding
                    
                    taskBreakdownChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Success',
                                    data: successCounts,
                                    backgroundColor: '#28a745'
                                },
                                {
                                    label: 'Failed',
                                    data: failedCounts,
                                    backgroundColor: '#dc3545'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    stacked: true,
                                    ticks: {
                                        autoSkip: false,
                                        maxRotation: 45,
                                        minRotation: 45
                                    }
                                },
                                y: {
                                    beginAtZero: true,
                                    stacked: true,
                                    suggestedMax: suggestedMax,
                                    ticks: {
                                        // Adjust step size or max ticks to improve vertical axis distribution
                                        maxTicksLimit: 10,
                                        callback: function(value) {
                                            // Format large numbers
                                            if (value >= 1000000) {
                                                return (value / 1000000).toFixed(1) + 'M';
                                            } else if (value >= 1000) {
                                                return (value / 1000).toFixed(1) + 'K';
                                            }
                                            return value;
                                        }
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                tooltip: {
                                    enabled: true,
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            label += context.parsed.y.toLocaleString();
                                            return label;
                                        }
                                    }
                                }
                            }
                        }
                    });
                    if (typeof i18n !== 'undefined') { i18n.applyTranslations(); } // Apply to new chart labels
                },
                function(jqXHR) {
                    const errorMsg = i18n.translate('statisticsPage.feedback.errorLoadingTaskBreakdown', 'Failed to load task breakdown data.');
                    $('#taskBreakdownBody').html(`<p class="text-danger">${errorMsg}</p>`);
                    console.error("Error loading task breakdown stats: ", jqXHR);
                }
            );
        }
    </script>
</body>
</html>
