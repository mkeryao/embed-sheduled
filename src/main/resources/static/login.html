<!DOCTYPE html>
<html lang="zh-CN">
<head>    <meta charset="UTF-8">
    <title>登录 - 任务调度系统</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card mt-5">
                    <div class="card-body">
                        <h3 class="card-title text-center">用户登录</h3>
                        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                        <form id="login-form">
                            <div class="form-group">
                                <label for="username">用户名</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">密码</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>    <script>
        $(document).ready(function() {
            // 防止登录页面闪烁
            setTimeout(function() {
                // If token exists, redirect to tasks.html
                if (localStorage.getItem('jwtToken')) {
                    window.location.href = 'tasks.html';
                }
            }, 100);

            $('#login-form').submit(function(event) {
                event.preventDefault();
                const username = $('#username').val();
                const password = $('#password').val();

                login(username, password,
                    function(response) { // onSuccess
                        localStorage.setItem('jwtToken', response.token);
                        localStorage.setItem('username', response.username); // Store username if needed
                        window.location.href = 'tasks.html';
                    },                    function(jqXHR) { // onError
                        let message = '登录失败。请检查您的用户名和密码。';
                        if (jqXHR.responseJSON && jqXHR.responseJSON.message) {
                            message = jqXHR.responseJSON.message;
                        } else if (jqXHR.responseText) {
                             try {
                                const err = JSON.parse(jqXHR.responseText);
                                if (err.message) message = err.message;
                             } catch(e) {
                                 /* ignore parse error */ 
                                }
                        }
                        $('#error-message').text(message).show();
                    }
                );
            });
        });
    </script>
</body>
</html>
