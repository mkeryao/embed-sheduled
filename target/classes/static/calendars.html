<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar Management - Task Scheduler</title>
    <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h2>Calendar Management</h2>
            <button class="btn btn-primary" data-toggle="modal" data-target="#calendarFormModal" id="addCalendarBtn">Add Calendar</button>
        </div>
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Calendar Name (Group)</th>
                    <th>Description (Remark)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="calendars-table-body">
                <!-- Calendar rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Calendar Form Modal (for TaskCalendar) -->
    <div class="modal fade" id="calendarFormModal" tabindex="-1" role="dialog" aria-labelledby="calendarFormModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="calendarFormModalLabel">Add/Edit Calendar</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="calendar-form">
                        <input type="hidden" id="calendarId">
                        <div class="form-group">
                            <label for="calendarName">Calendar Name (Group)</label>
                            <input type="text" class="form-control" id="calendarName" required>
                        </div>
                        <div class="form-group">
                            <label for="calendarDescription">Description (Remark)</label>
                            <textarea class="form-control" id="calendarDescription" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">Save Calendar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Calendar Days Management Modal (for TaskCalendarDay) -->
    <div class="modal fade" id="calendarDaysModal" tabindex="-1" role="dialog" aria-labelledby="calendarDaysModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="calendarDaysModalLabel">Manage Calendar Days for <span id="daysModalCalendarName"></span></h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="currentCalendarIdForDays">
                    <h5>Add New Day Entry</h5>
                    <form id="calendar-day-form" class="form-inline mb-3">
                        <div class="form-group mr-2">
                            <label for="eventDate" class="sr-only">Date</label>
                            <input type="date" class="form-control" id="eventDate" placeholder="Event Date" required>
                        </div>
                        <div class="form-group mr-2">
                            <label for="dayDescription" class="sr-only">Description</label>
                            <input type="text" class="form-control" id="dayDescription" placeholder="Day Description">
                        </div>
                        <div class="form-check mr-2">
                            <input class="form-check-input" type="checkbox" id="isWorkingDay" checked>
                            <label class="form-check-label" for="isWorkingDay">
                                Is Working Day?
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Day</button>
                    </form>
                    <hr/>
                    <h5>Existing Days</h5>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Working Day?</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="calendar-days-list">
                            <!-- Day entries will be listed here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <script src="libs/jquery/jquery-3.5.1.min.js"></script>
    <script src="libs/popperjs/popper.min.js"></script>
    <script src="libs/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            $("#navbar-container").load("_navbar.html", function() {
                 const currentUsername = localStorage.getItem('username');
                 if (currentUsername) {
                    $('#loggedInUser').text(currentUsername);
                 }
                 $('#logout-link').on('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            });
            loadCalendars();

            function loadCalendars() {
                makeApiCall('GET', '/calendars', null,
                    function(calendars) {
                        const tableBody = $('#calendars-table-body');
                        tableBody.empty();
                        calendars.forEach(function(calendar) {
                            const row = `<tr>
                                <td>${calendar.calendarId}</td>
                                <td>${calendar.calendarName || ''}</td>
                                <td>${calendar.description || ''}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-sm btn-info manage-days-btn" data-id="${calendar.calendarId}" data-name="${calendar.calendarName}">Manage Days</button>
                                    <button class="btn btn-sm btn-danger delete-calendar-btn" data-id="${calendar.calendarId}">Delete Calendar</button>
                                </td>
                            </tr>`;
                            tableBody.append(row);
                        });
                    },
                    function(jqXHR) {
                        showFeedback('Error loading calendars: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            $('#addCalendarBtn').click(function() {
                $('#calendarFormModalLabel').text('Add Calendar');
                $('#calendar-form')[0].reset();
                $('#calendarId').val('');
            });

            $('#calendar-form').submit(function(event) {
                event.preventDefault();
                const calendarId = $('#calendarId').val(); // Not currently using edit for calendars, only add.
                const calendarData = {
                    calendarName: $('#calendarName').val(),
                    description: $('#calendarDescription').val(),
                    // days: [] // Days are managed separately after calendar creation for simplicity here
                };

                // For this simplified UI, we are not supporting edit of calendar name/description.
                // Only add. If edit was needed, it would be similar to tasks.
                if (calendarId) {
                     showFeedback('Editing existing calendars is not supported in this UI version.', true);
                     return;
                }

                makeApiCall('POST', '/calendars', calendarData,
                    function(response) {
                        $('#calendarFormModal').modal('hide');
                        showFeedback('Calendar saved successfully!', false);
                        loadCalendars();
                    },
                    function(jqXHR) {
                        showFeedback('Error saving calendar: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            });

            // Delete Calendar
            $('#calendars-table-body').on('click', '.delete-calendar-btn', function() {
                const calId = $(this).data('id');
                if (confirm('Are you sure you want to delete calendar ' + calId + '? This will also delete all its day entries.')) {
                    makeApiCall('DELETE', `/calendars/${calId}`, null,
                        function() {
                            showFeedback('Calendar deleted successfully!', false);
                            loadCalendars();
                        },
                        function(jqXHR) {
                            showFeedback('Error deleting calendar: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });

            // --- Manage Calendar Days ---
            let currentManagingCalendarId = null;

            $('#calendars-table-body').on('click', '.manage-days-btn', function() {
                currentManagingCalendarId = $(this).data('id');
                const calendarName = $(this).data('name');
                $('#daysModalCalendarName').text(calendarName);
                $('#currentCalendarIdForDays').val(currentManagingCalendarId);
                loadCalendarDays(currentManagingCalendarId);
                $('#calendarDaysModal').modal('show');
            });

            function loadCalendarDays(calendarId) {
                makeApiCall('GET', `/calendars/${calendarId}/days`, null,
                    function(days) {
                        const daysList = $('#calendar-days-list');
                        daysList.empty();
                        if (days && days.length > 0) {
                            days.forEach(function(day) {
                                const row = `<tr>
                                    <td>${day.eventDate}</td>
                                    <td>${day.description || '-'}</td>
                                    <td>${day.isWorkingDay ? 'Yes' : 'No'}</td>
                                    <td><button class="btn btn-xs btn-danger delete-day-btn" data-day-id="${day.dayId}">Delete</button></td>
                                </tr>`;
                                daysList.append(row);
                            });
                        } else {
                            daysList.append('<tr><td colspan="4">No day entries found for this calendar.</td></tr>');
                        }
                    },
                    function(jqXHR) {
                        $('#calendar-days-list').html('<tr><td colspan="4">Error loading days.</td></tr>');
                        showFeedback('Error loading calendar days: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                    }
                );
            }

            $('#calendar-day-form').submit(function(event) {
                event.preventDefault();
                const calendarId = $('#currentCalendarIdForDays').val();
                if (!calendarId) {
                    showFeedback('No calendar selected for adding day.', true);
                    return;
                }
                const dayData = {
                    eventDate: $('#eventDate').val(),
                    description: $('#dayDescription').val(),
                    isWorkingDay: $('#isWorkingDay').is(':checked')
                };

                makeApiCall('POST', `/calendars/${calendarId}/days`, dayData,
                    function(response) {
                        showFeedback('Day entry added successfully!', false);
                        loadCalendarDays(calendarId); // Refresh list
                        $('#calendar-day-form')[0].reset();
                    },
                    function(jqXHR) {
                         let msg = 'Error adding day entry.';
                         if (jqXHR.status === 409) msg = 'Day entry for this date already exists.';
                         else if(jqXHR.responseJSON && jqXHR.responseJSON.message) msg = jqXHR.responseJSON.message;
                         showFeedback(msg, true);
                    }
                );
            });

            $('#calendar-days-list').on('click', '.delete-day-btn', function() {
                const dayId = $(this).data('day-id');
                const calendarId = $('#currentCalendarIdForDays').val();
                if (confirm('Are you sure you want to delete this day entry?')) {
                    makeApiCall('DELETE', `/calendars/${calendarId}/days/${dayId}`, null,
                        function() {
                            showFeedback('Day entry deleted successfully!', false);
                            loadCalendarDays(calendarId); // Refresh list
                        },
                        function(jqXHR) {
                            showFeedback('Error deleting day entry: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.message : jqXHR.statusText), true);
                        }
                    );
                }
            });
        });
    </script>
</body>
</html>
